<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<meta name="theme-color" content="#ffb703">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="مرح الصغار">
<title>مرح الصغار</title>
<style>
/* VOICE: فرح طفولي، ألوان مشبعة وحركة نطّاطة
   IDEA: صندوق ألعاب؛ كل ضغطة تفاجئ الطفلة
   PICTURE: حيوان أو حرف ضخم يملأ الشاشة
   COLOUR: خلفيات زاهية تتبدل مع كل بطاقة
   TYPE: Tajawal ثقيل / LAYOUT: شاشة كاملة بلا تفاصيل صغيرة */
@font-face{font-family:'Tajawal';font-weight:800;src:url(../rihla-game/fonts/tajawal-arabic-800-normal.woff2) format('woff2'),url(fonts/tajawal-arabic-800-normal.woff2) format('woff2')}
@font-face{font-family:'Tajawal';font-weight:400;src:url(../rihla-game/fonts/tajawal-arabic-400-normal.woff2) format('woff2'),url(fonts/tajawal-arabic-400-normal.woff2) format('woff2')}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;font-family:Tajawal,system-ui,sans-serif;font-weight:800;user-select:none;-webkit-user-select:none;touch-action:manipulation}
body{background:#ffb703;transition:background .5s}
.emo{font-family:'Noto Color Emoji','Apple Color Emoji','Segoe UI Emoji',sans-serif;font-weight:400;line-height:1}
.view{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.hidden{display:none!important}
/* home */
#home h1{font-size:clamp(34px,7vw,72px);color:#fff;text-shadow:0 4px 0 rgba(0,0,0,.15);margin-bottom:3vh}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:2.5vw;width:min(94vw,1200px)}
.tile{border:none;border-radius:32px;padding:3vh 1vw;background:#fff;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1vh;font:inherit;font-size:clamp(18px,3vw,34px);color:#333;box-shadow:0 10px 0 rgba(0,0,0,.15);transition:transform .15s}
.tile .ic{font-size:clamp(60px,12vw,150px);line-height:1;height:1.15em;display:flex;align-items:center}
.tile .big{font-family:Tajawal,sans-serif;font-weight:800}
.tile:nth-child(1){background:#c7f9cc}.tile:nth-child(2){background:#ffd6e0}.tile:nth-child(3){background:#cde7ff}.tile:nth-child(4){background:#fff1b8}
.tile:focus{outline:none;transform:scale(1.08) rotate(-2deg);box-shadow:0 0 0 8px #fff,0 14px 0 rgba(0,0,0,.2)}
@media (max-width:700px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
/* stage */
#stage{cursor:pointer}
#hero{font-size:min(52vh,60vw);transition:transform .2s;filter:drop-shadow(0 18px 0 rgba(0,0,0,.12))}
#hero.txt{font-family:Tajawal,sans-serif;font-weight:800;color:#fff;font-size:min(40vh,48vw);line-height:1.35;text-shadow:0 12px 0 rgba(0,0,0,.15)}
#label{font-size:clamp(36px,9vh,96px);color:#fff;text-shadow:0 5px 0 rgba(0,0,0,.18);margin-top:1vh;display:flex;align-items:center;gap:.4em}
#label .emo{font-size:1.1em}
.pop-in{animation:popIn .55s cubic-bezier(.2,1.6,.4,1)}
@keyframes popIn{from{transform:scale(.1) rotate(-20deg);opacity:0}to{transform:scale(1);opacity:1}}
.wiggle{animation:wig .6s}
@keyframes wig{0%,100%{transform:rotate(0) scale(1)}20%{transform:rotate(-12deg) scale(1.1)}40%{transform:rotate(10deg) scale(1.15)}60%{transform:rotate(-8deg) scale(1.1)}80%{transform:rotate(5deg)}}
.bounce{animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-3vh)}}
#counter{display:flex;flex-wrap:wrap;justify-content:center;gap:1.2vw;max-width:92vw;margin-top:2vh;min-height:20vh;align-items:center}
#counter span{font-size:min(14vh,9vw)}
.navbtn{position:fixed;top:50%;transform:translateY(-50%);border:none;background:rgba(255,255,255,.35);color:#fff;font-size:clamp(28px,5vw,56px);width:clamp(56px,8vw,96px);height:clamp(56px,8vw,96px);border-radius:50%;cursor:pointer;z-index:3}
#prevBtn{right:2vw}#nextBtn{left:2vw}
#homeBtn{position:fixed;top:2vh;right:2vw;border:none;background:rgba(255,255,255,.4);border-radius:20px;font-size:clamp(28px,4vw,44px);padding:.2em .4em;cursor:pointer;z-index:3}
/* balloons */
.balloon{position:fixed;width:min(22vh,26vw);height:calc(min(22vh,26vw)*1.22);border-radius:50% 50% 48% 48%;display:flex;align-items:center;justify-content:center;font-size:min(11vh,13vw);cursor:pointer;border:4px solid rgba(255,255,255,.75);box-shadow:inset -14px -18px 0 rgba(0,0,0,.12),inset 12px 10px 0 rgba(255,255,255,.35);z-index:2}
.balloon::after{content:'';position:absolute;bottom:-14%;left:50%;width:2px;height:16%;background:rgba(0,0,0,.25)}
.balloon::before{content:'';position:absolute;bottom:-3%;left:calc(50% - 8px);border:8px solid transparent;border-bottom:10px solid;border-bottom-color:inherit;transform:rotate(180deg);opacity:.9}
#fx{position:fixed;inset:0;pointer-events:none;z-index:5}
#tapHint{position:fixed;bottom:3vh;left:0;right:0;text-align:center;color:rgba(255,255,255,.9);font-size:clamp(16px,2.6vh,26px)}
@media (prefers-reduced-motion:reduce){.bounce{animation:none}}
/* ---- animated letter scenes ---- */
#scene{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
#hero,#label,#counter{position:relative;z-index:2}
#stage.withScene{justify-content:flex-start;padding-top:5vh}
#stage.withScene #hero.txt{font-size:min(21vh,25vw);line-height:1.5;text-shadow:0 6px 0 rgba(255,255,255,.6)}
#stage.withScene #label{font-size:clamp(30px,7vh,72px);margin-top:0;text-shadow:0 4px 0 rgba(255,255,255,.6)}
.backdrop{position:absolute;left:0;bottom:0;width:100%;display:block}
.ground{position:absolute;left:0;right:0;bottom:0;height:11vh}
.sun{position:absolute;width:16vh;height:16vh;border-radius:50%;background:#ffd43b;box-shadow:0 0 0 2vh rgba(255,212,59,.35),0 0 0 4vh rgba(255,212,59,.15);animation:spin 8s ease-in-out infinite alternate}
@keyframes spin{to{transform:scale(1.08)}}
.cloud{position:absolute;opacity:.95;animation:drift linear infinite}
@keyframes drift{from{transform:translateX(30vw)}to{transform:translateX(-120vw)}}
.deco{position:absolute;font-size:9vh}
.water{position:absolute;left:0;right:0;bottom:0;height:22vh;background:rgba(51,154,240,.78);z-index:3}
.water::before{content:'';position:absolute;top:-2.2vh;left:-10vw;width:130vw;height:4.4vh;background:radial-gradient(circle at 50% 100%,rgba(51,154,240,.78) 58%,transparent 60%) 0 0/8vh 4.4vh repeat-x;animation:waves 2.4s linear infinite}
@keyframes waves{to{transform:translateX(8vh)}}
.actor{position:absolute;left:0;pointer-events:auto;cursor:pointer;z-index:2}
.actor svg{display:block;width:100%;height:100%;overflow:visible}
.yaywrap,.swim,.hopper{width:100%;height:100%}
.yay{animation:yay .7s ease-out}
@keyframes yay{30%{transform:translateY(-7vh) scale(1.15) rotate(-6deg)}65%{transform:translateY(0) scale(.94)}}
.p{transform-box:fill-box}
@keyframes walk{from{transform:translateX(105vw)}to{transform:translateX(-60vh)}}
@keyframes step{0%,100%{transform:rotate(16deg)}50%{transform:rotate(-16deg)}}
@keyframes bob2{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes nod{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(5deg)}}
@keyframes swish{0%,100%{transform:rotate(-14deg)}50%{transform:rotate(16deg)}}
.leg{transform-origin:50% 0%;animation:step 1s ease-in-out infinite}.leg.b{animation-delay:-.5s}
.bob{animation:bob2 .5s ease-in-out infinite}
.neck{transform-origin:72% 100%;animation:nod 2s ease-in-out infinite}
.tail{transform-origin:0% 0%;animation:swish 1.2s ease-in-out infinite}
/* falcon */
.falcon{top:6vh;width:48vh;height:32vh;animation:fly 9s ease-in-out infinite}
@keyframes fly{0%{transform:translate(105vw,4vh) rotate(4deg)}30%{transform:translate(62vw,32vh) rotate(-12deg)}45%{transform:translate(45vw,38vh) rotate(0)}65%{transform:translate(25vw,16vh) rotate(12deg)}100%{transform:translate(-60vh,-2vh) rotate(6deg)}}
.wing{transform-origin:15% 100%;animation:flap .42s ease-in-out infinite alternate}.wing.far{animation-delay:-.1s}
@keyframes flap{from{transform:scaleY(1)}to{transform:scaleY(-.6)}}
/* giraffe */
.giraffe{bottom:7vh;height:54vh;width:49vh;animation:walk 17s linear infinite}
/* duck */
.duck{bottom:11.5vh;height:30vh;width:39vh;animation:walk 19s linear infinite}
.swim{transform-origin:50% 70%;animation:rock 1.6s ease-in-out infinite}
@keyframes rock{0%,100%{transform:rotate(-3deg) translateY(0)}50%{transform:rotate(3deg) translateY(-1vh)}}
.paddle{transform-origin:50% 0%;animation:step .6s ease-in-out infinite}.paddle.b{animation-delay:-.3s}
.dwing{transform-origin:5% 60%;animation:dflap 3s ease-in-out infinite}
@keyframes dflap{0%,68%,100%{transform:rotate(0)}74%,86%{transform:rotate(-30deg)}80%,92%{transform:rotate(0)}}
.dhead{transform-origin:60% 100%;animation:nod 1.6s ease-in-out infinite}
.ripple{transform-origin:50% 50%;animation:ripple 1.8s ease-out infinite}.ripple.r2{animation-delay:-.9s}
@keyframes ripple{from{transform:scale(.3);opacity:1}to{transform:scale(2.2);opacity:0}}
/* rabbit */
.rabbit{bottom:8vh;height:30vh;width:30vh;animation:walk 13s linear infinite}
.hopper{transform-origin:50% 100%;animation:hop .9s ease-in-out infinite}
@keyframes hop{0%{transform:translateY(0) scale(1.08,.88)}15%{transform:translateY(-2vh) scale(.95,1.08)}50%{transform:translateY(-16vh) rotate(-8deg)}85%{transform:translateY(0) rotate(3deg)}100%{transform:translateY(0) scale(1.08,.88)}}
.ear{transform-origin:50% 100%;animation:earflop .9s ease-in-out infinite}
@keyframes earflop{0%,100%{transform:rotate(0)}50%{transform:rotate(16deg)}}
.bleg{transform-origin:85% 40%;animation:kick .9s ease-in-out infinite}
@keyframes kick{0%,100%{transform:rotate(0)}30%,60%{transform:rotate(-32deg)}}
/* camel */
.camel{bottom:5vh;height:48vh;width:51vh;animation:walk 24s linear infinite}
.camel .leg{animation-duration:1.6s}.camel .leg.b{animation-delay:-.8s}
.camel .bob{animation-duration:.8s}.camel .neck{animation-duration:1.6s}
@media (prefers-reduced-motion:reduce){.actor,.cloud{animation-duration:60s}}
.walker{animation:walk linear infinite}
.fast .leg{animation-duration:.45s}.fast .leg.b{animation-delay:-.225s}.fast .bob{animation-duration:.225s}
.slow .leg{animation-duration:1.5s}.slow .leg.b{animation-delay:-.75s}.slow .bob{animation-duration:.75s}
.peck{transform-origin:85% 100%;animation:peck 2.4s ease-in-out infinite}
@keyframes peck{0%,55%,100%{transform:rotate(0)}65%,75%{transform:rotate(-38deg)}70%,80%{transform:rotate(-30deg)}}
.howl{transform-origin:75% 100%;animation:howl 5s ease-in-out infinite}
@keyframes howl{0%,50%,100%{transform:rotate(0)}60%,85%{transform:rotate(26deg)}}
.trunk{transform-origin:50% 0%;animation:swish 1.8s ease-in-out infinite}
.ear2{transform-origin:0% 50%;animation:earflap 1.4s ease-in-out infinite}
@keyframes earflap{50%{transform:scaleX(1.2) rotate(-6deg)}}
.wag{transform-origin:0% 100%;animation:wag .28s ease-in-out infinite alternate}
@keyframes wag{from{transform:rotate(-20deg)}to{transform:rotate(20deg)}}
.wave{transform-origin:0% 100%;animation:swish 1.6s ease-in-out infinite}
.fear{transform-origin:50% 0%;animation:swish .9s ease-in-out infinite}
.tongue{transform-origin:50% 0%;animation:pant .3s ease-in-out infinite alternate}
@keyframes pant{to{transform:scaleY(1.35)}}
.dust{transform-origin:50% 50%;animation:dust .5s ease-out infinite}.dust.d2{animation-delay:-.25s}
@keyframes dust{from{transform:scale(.3);opacity:.9}to{transform:scale(1.8) translateX(16px);opacity:0}}
.twinkle{position:absolute;width:1.2vh;height:1.2vh;background:#fff;border-radius:50%;box-shadow:0 0 1.5vh #fff;animation:tw 1.6s ease-in-out infinite alternate}
@keyframes tw{from{opacity:.25;transform:scale(.6)}to{opacity:1;transform:scale(1.2)}}
</style>
</head>
<body>
<canvas id="fx"></canvas>

<div id="home" class="view">
  <h1>مرح الصغار</h1>
  <div class="tiles">
    <button class="tile" data-mode="animals"><span class="ic emo">🐮</span>الحيوانات</button>
    <button class="tile" data-mode="letters"><span class="ic big">أ ب</span>الحروف</button>
    <button class="tile" data-mode="numbers"><span class="ic big">١٢٣</span>الأرقام</button>
    <button class="tile" data-mode="balloons"><span class="ic emo">🎈</span>البالونات</button>
  </div>
  <a href="credits.html" tabindex="-1" style="position:fixed;bottom:1.5vh;color:rgba(255,255,255,.85);font-size:13px;font-weight:400">حقوق الأصوات</a>
</div>

<div id="stage" class="view hidden">
  <div id="scene"></div>
  <button id="homeBtn" class="emo" tabindex="-1" aria-label="الرئيسية">🏠</button>
  <button id="prevBtn" class="navbtn" tabindex="-1" aria-label="السابق">▶</button>
  <button id="nextBtn" class="navbtn" tabindex="-1" aria-label="التالي">◀</button>
  <div id="hero" class="emo"></div>
  <div id="counter" class="emo hidden"></div>
  <div id="label"></div>
  <div id="tapHint"></div>
</div>

<script src="scenes.js"></script>
<script src="scenes2.js"></script>
<script src="scenes3.js"></script>
<script src="scenes4.js"></script>
<script>
{
const $=s=>document.querySelector(s);
const ar=n=>String(n).replace(/\d/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]);
const COLORS=['#ff6b6b','#4dabf7','#51cf66','#ffa94d','#cc5de8','#20c997','#f06595','#339af0','#fab005','#ff922b','#5c7cfa','#94d82d'];

/* ---------- sound engine (all synthesized, no files) ---------- */
let AC=null,NOISE=null;
function ac(){if(!AC){AC=new(window.AudioContext||window.webkitAudioContext)();const b=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;NOISE=b}if(AC.state==='suspended')AC.resume();return AC}
function ramp(p,pts,t){pts.forEach(([tt,v],i)=>i?p.linearRampToValueAtTime(v,t+tt):p.setValueAtTime(v,t+tt))}
function lfo(c,t,dur,rate,depth,param){const l=c.createOscillator(),g=c.createGain();l.frequency.value=rate;g.gain.value=depth;l.connect(g);g.connect(param);l.start(t);l.stop(t+dur+.05)}
function out(c,node,t,dur,vol,att){const g=c.createGain();g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+(att||Math.min(.04,dur/4)));g.gain.setValueAtTime(vol,t+dur*.72);g.gain.exponentialRampToValueAtTime(.0001,t+dur);node.connect(g);g.connect(c.destination)}
function filt(c,node,o,t){if(!o)return node;const f=c.createBiquadFilter();f.type=o.type||'bandpass';f.Q.value=o.q||1;ramp(f.frequency,o.f,t);node.connect(f);return f}
function V(o){try{const c=ac(),t=c.currentTime+(o.t0||0),dur=o.dur||.5;const s=c.createOscillator();s.type=o.type||'sawtooth';ramp(s.frequency,o.f,t);
 if(o.vib)lfo(c,t,dur,o.vibRate||6,o.vib,s.frequency);
 let n=filt(c,s,o.filt,t);
 if(o.am){const g=c.createGain();g.gain.value=1-o.am;lfo(c,t,dur,o.amRate,o.am,g.gain);n.connect(g);n=g}
 out(c,n,t,dur,o.vol||.3,o.att);s.start(t);s.stop(t+dur+.05)}catch(e){}}
function N(o){try{const c=ac(),t=c.currentTime+(o.t0||0),dur=o.dur||.5;const s=c.createBufferSource();s.buffer=NOISE;let n=filt(c,s,o.filt,t);out(c,n,t,dur,o.vol||.3,o.att);s.start(t,Math.random());s.stop(t+dur+.05)}catch(e){}}
const SND={
 cat(){V({f:[[0,520],[.25,900],[.75,560]],dur:.8,filt:{f:[[0,900],[.3,1900],[.75,1000]],q:3},vol:.4,vib:15,vibRate:5})},
 dog(){for(let i=0;i<2;i++){V({f:[[0,330],[.12,200]],dur:.17,filt:{type:'lowpass',f:[[0,1500],[.12,600]],q:2},vol:.5,t0:i*.3});N({dur:.14,filt:{f:[[0,900]],q:1},vol:.25,t0:i*.3})}},
 cow(){V({f:[[0,135],[.3,125],[1.3,95]],dur:1.45,filt:{type:'lowpass',f:[[0,300],[.4,950],[1.3,350]],q:4},vol:.6,vib:2,vibRate:4,att:.15})},
 sheep(){V({f:[[0,390],[.9,330]],dur:1,filt:{f:[[0,1300],[1,1000]],q:2},vol:.4,am:.6,amRate:9})},
 duck(){for(let i=0;i<3;i++)V({type:'square',f:[[0,540],[.13,380]],dur:.15,filt:{f:[[0,1100]],q:5},vol:.4,t0:i*.22})},
 rooster(){V({f:[[0,500],[.15,820],[.35,840],[.5,1100],[1.1,1150],[1.45,700]],dur:1.5,filt:{f:[[0,1500]],q:2},vol:.35,vib:20,vibRate:12})},
 lion(){N({dur:1.5,filt:{type:'lowpass',f:[[0,250],[.5,750],[1.5,200]],q:3},vol:.8,att:.25});V({f:[[0,90],[.6,115],[1.5,70]],dur:1.5,filt:{type:'lowpass',f:[[0,420]]},vol:.4,am:.5,amRate:25,att:.25})},
 elephant(){V({f:[[0,450],[.2,900],[.8,960],[1.1,600]],dur:1.2,filt:{f:[[0,1200],[.4,2200]],q:2},vol:.4,vib:25,vibRate:7})},
 horse(){V({f:[[0,700],[.2,1150],[1.2,430]],dur:1.25,filt:{f:[[0,1400],[1.2,900]],q:2},vol:.35,vib:60,vibRate:16})},
 frog(){for(let i=0;i<2;i++)V({type:'square',f:[[0,190],[.2,140]],dur:.24,filt:{type:'lowpass',f:[[0,900]],q:6},vol:.5,am:.9,amRate:40,t0:i*.36})},
 bird(){[0,.13,.42,.55,.68].forEach(t0=>V({type:'sine',f:[[0,2200],[.07,3500]],dur:.09,vol:.25,t0}))},
 chick(){for(let i=0;i<3;i++)V({type:'sine',f:[[0,2600],[.12,3300]],dur:.14,vol:.28,t0:i*.25})},
 bee(){V({f:[[0,210],[1.2,240]],dur:1.3,filt:{f:[[0,650]],q:2},vol:.3,vib:15,vibRate:25})},
 camel(){V({f:[[0,115],[.5,95],[1,80]],dur:1.05,filt:{type:'lowpass',f:[[0,500],[.5,850],[1,300]],q:5},vol:.5,am:.7,amRate:14});N({dur:1,filt:{type:'lowpass',f:[[0,420]]},vol:.2})},
 pop(p){p=p||1;V({type:'sine',f:[[0,500*p],[.08,1300*p]],dur:.12,vol:.4});N({dur:.06,filt:{type:'highpass',f:[[0,2000]]},vol:.3})},
 jingle(k){const sc=[523,587,659,698,784,880,988,1047];const base=k%4;[0,2,4,7].forEach((s,i)=>V({type:'triangle',f:[[0,sc[(base+s)%8]*(base+s>=8?2:1)]],dur:.22,vol:.25,t0:i*.11}))},
 tada(){[523,659,784,1047,784,1047].forEach((f,i)=>V({type:'triangle',f:[[0,f]],dur:.25,vol:.25,t0:i*.1}))},
 screech(){V({f:[[0,1900],[.15,2600],[.9,1500]],dur:.95,filt:{f:[[0,2400]],q:2},vol:.3,vib:90,vibRate:30})},
 boing(){V({type:'sine',f:[[0,180],[.08,520],[.4,260]],dur:.45,vol:.4,vib:30,vibRate:18})},
 cluck(){[0,.18,.36,.7].forEach(t0=>V({type:'square',f:[[0,700],[.08,450]],dur:.1,filt:{f:[[0,1200]],q:4},vol:.35,t0}))},
 howl(){V({type:'sine',f:[[0,380],[.5,720],[1.6,760],[2.2,520]],dur:2.3,vol:.35,vib:8,vibRate:5,att:.3})},
 blub(){[0,.25,.45].forEach((t0,i)=>V({type:'sine',f:[[0,300+i*80],[.12,900+i*120]],dur:.14,vol:.35,t0}))},
 plane(){N({dur:2,filt:{type:'bandpass',f:[[0,300],[2,1400]],q:1.2},vol:.35,att:.4});V({f:[[0,90],[2,180]],dur:2,filt:{type:'lowpass',f:[[0,500]]},vol:.25,am:.6,amRate:30,att:.4})},
 rain(){N({dur:2.2,filt:{type:'highpass',f:[[0,2500]]},vol:.15,att:.3});[0,.3,.5,.9,1.2,1.5,1.8].forEach(t0=>V({type:'sine',f:[[0,1800+Math.random()*900],[.05,900]],dur:.07,vol:.2,t0}))},
 chime(){[1047,1319,1568,2093].forEach((f,i)=>V({type:'sine',f:[[0,f]],dur:.5,vol:.2,t0:i*.12}))},
 whoosh(){N({dur:.35,filt:{f:[[0,400],[.35,2500]],q:1.5},vol:.25})}
};
/* optional spoken names where the device has an Arabic voice (phones, iPad) */
let arVoice=null;
function loadVoices(){try{const vs=speechSynthesis.getVoices();arVoice=vs.find(v=>/^ar/i.test(v.lang))||null}catch(e){}}
try{loadVoices();speechSynthesis.onvoiceschanged=loadVoices}catch(e){}
function say(text,delay){if(!arVoice||!text)return;setTimeout(()=>{try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.voice=arVoice;u.lang=arVoice.lang;u.rate=.85;u.pitch=1.2;speechSynthesis.speak(u)}catch(e){}},delay||0)}

/* real recordings + Arabic voice files, with synthesized fallback */
const VARIANTS={cat:3,dog:2};
const cache={};
function file(path,fallback){let a=cache[path];if(a===false){if(fallback)fallback();return}
 if(!a){a=new Audio(path);a.preload='auto';cache[path]=a;a.addEventListener('error',()=>{cache[path]=false},{once:true})}
 try{a.pause();a.currentTime=0;const p=a.play();if(p&&p.catch)p.catch(()=>{if(a.error||a.networkState===3){cache[path]=false;if(fallback)fallback()}})}catch(e){if(fallback)fallback()}}
const vIdx={};
function animalSound(key){const n=VARIANTS[key]||1;vIdx[key]=((vIdx[key]||0)%n)+1;file('sounds/animals/'+key+'_'+vIdx[key]+'.mp3',()=>SND[key]())}
function voice(name,fallbackText,delay){later(()=>file('sounds/voice/'+name+'.mp3',()=>say(fallbackText)),delay||0)}
function stopAll(){for(const k in cache){const a=cache[k];if(a){try{a.pause();a.currentTime=0}catch(e){}}}try{speechSynthesis.cancel()}catch(e){}}
/* ---------- content ---------- */
const ANIMALS=[['🐱','قطة','cat'],['🐶','كلب','dog'],['🐮','بقرة','cow'],['🐑','خروف','sheep'],['🦆','بطة','duck'],['🐓','ديك','rooster'],['🦁','أسد','lion'],['🐘','فيل','elephant'],['🐴','حصان','horse'],['🐸','ضفدع','frog'],['🐦','عصفور','bird'],['🐥','كتكوت','chick'],['🐝','نحلة','bee'],['🐪','جمل','camel']];
const LETTERS=[['أ','ألف','🐇','أرنب'],['ب','باء','🦆','بطة'],['ت','تاء','🍎','تفاحة'],['ث','ثاء','🦊','ثعلب'],['ج','جيم','🐪','جمل'],['ح','حاء','🐴','حصان'],['خ','خاء','🐑','خروف'],['د','دال','🐔','دجاجة'],['ذ','ذال','🐺','ذئب'],['ر','راء','🪶','ريشة'],['ز','زاي','🦒','زرافة'],['س','سين','🐟','سمكة'],['ش','شين','☀️','شمس'],['ص','صاد','🦅','صقر'],['ض','ضاد','🐸','ضفدع'],['ط','طاء','✈️','طائرة'],['ظ','ظاء','✉️','ظرف'],['ع','عين','🍇','عنب'],['غ','غين','☁️','غيمة'],['ف','فاء','🐘','فيل'],['ق','قاف','🐱','قطة'],['ك','كاف','🐶','كلب'],['ل','لام','🍋','ليمون'],['م','ميم','🍌','موز'],['ن','نون','🐝','نحلة'],['هـ','هاء','🎁','هدية'],['و','واو','🌹','وردة'],['ي','ياء','✋','يد']];
const NUMW=['','واحد','اثنان','ثلاثة','أربعة','خمسة','ستة','سبعة','ثمانية','تسعة','عشرة'];
const COUNT_EMO=['🍎','🐥','⭐','🎈','🐟','🍌','🌸','🐞','🍓','🦋'];

/* ---------- confetti ---------- */
const fx=$('#fx'),fc=fx.getContext('2d');let bits=[];
function sizeFx(){fx.width=innerWidth;fx.height=innerHeight}addEventListener('resize',sizeFx);sizeFx();
function confetti(n,x,y){x=x==null?innerWidth/2:x;y=y==null?innerHeight*.45:y;for(let i=0;i<(n||40);i++){const a=Math.random()*Math.PI*2,s=4+Math.random()*9;bits.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-6,r:5+Math.random()*7,rot:Math.random()*6,vr:(Math.random()-.5)*.3,c:COLORS[i%COLORS.length],life:1,star:Math.random()<.35})}}
function fxLoop(){fc.clearRect(0,0,fx.width,fx.height);for(const b of bits){b.x+=b.vx;b.y+=b.vy;b.vy+=.35;b.vx*=.99;b.rot+=b.vr;b.life-=.012;fc.save();fc.globalAlpha=Math.max(0,b.life);fc.translate(b.x,b.y);fc.rotate(b.rot);fc.fillStyle=b.c;
 if(b.star){fc.beginPath();for(let k=0;k<10;k++){const r=k%2?b.r/2:b.r,a=-Math.PI/2+k*Math.PI/5;fc.lineTo(Math.cos(a)*r,Math.sin(a)*r)}fc.fill()}else fc.fillRect(-b.r/2,-b.r/4,b.r,b.r/2);fc.restore()}
 bits=bits.filter(b=>b.life>0&&b.y<fx.height+40);requestAnimationFrame(fxLoop)}
requestAnimationFrame(fxLoop);

/* ---------- views ---------- */
let mode=null,idx=0,timers=[],bgI=0;
const hero=$('#hero'),label=$('#label'),counter=$('#counter');
function clearTimers(){timers.forEach(clearTimeout);timers=[];if(typeof stopAll==='function')stopAll()}
function later(fn,ms){timers.push(setTimeout(fn,ms))}
function setBg(){bgI=(bgI+1)%COLORS.length;document.body.style.background=COLORS[bgI]}
function anim(el,cls){el.classList.remove('pop-in','wiggle');void el.offsetWidth;el.classList.add(cls)}
function goHome(){clearTimers();stopBalloons();setScene(null);mode=null;$('#stage').classList.add('hidden');$('#home').classList.remove('hidden');document.body.style.background='#ffb703';setTimeout(()=>{const t=document.querySelector('.tile[data-mode="'+(lastMode||'animals')+'"]')||document.querySelector('.tile');t.focus()},50)}
let lastMode=null;
function start(m){mode=m;lastMode=m;idx=0;$('#home').classList.add('hidden');$('#stage').classList.remove('hidden');
 const nav=m!=='balloons';$('#prevBtn').classList.toggle('hidden',!nav);$('#nextBtn').classList.toggle('hidden',!nav);
 $('#tapHint').textContent=m==='balloons'?'اضغطي على البالونات 🎈':'';
 setScene(null);if(m==='balloons'){hero.textContent='';label.textContent='';counter.classList.add('hidden');startBalloons()}else render(true)}
const FILE_ANIMALS=['cat','dog','cow','sheep','duck','rooster','lion','elephant','horse','frog','bird','bee','camel','chick'];
function sceneSound(sc){if(FILE_ANIMALS.includes(sc.sound))animalSound(sc.sound);else if(SND[sc.sound])SND[sc.sound]()}
function setScene(sc){const el=$('#scene');$('#stage').classList.toggle('withScene',!!sc);el.innerHTML=sc?sc.html:'';hero.style.color=sc?sc.ink:'';label.style.color=sc?sc.ink:'';
 if(sc){document.body.style.background=sc.bg;const a=el.querySelector('.actor');if(a)a.addEventListener('click',e=>{e.stopPropagation();actorYay()})}}
function actorYay(){const sc=mode==='letters'&&window.SCENES&&SCENES[idx];if(!sc)return false;const w=$('#scene .yaywrap');if(w){w.classList.remove('yay');void w.offsetWidth;w.classList.add('yay')}sceneSound(sc);confetti(25);return true}
function render(){clearTimers();setBg();setScene(null);counter.classList.add('hidden');counter.innerHTML='';hero.className='emo';
 if(mode==='animals'){const a=ANIMALS[idx];hero.textContent=a[0];label.innerHTML='';label.textContent=a[1];anim(hero,'pop-in');later(()=>hero.classList.add('bounce'),600);SND.whoosh();later(()=>{animalSound(a[2]);anim(hero,'wiggle')},350);voice('n_'+a[2],a[1],3000);confetti(30)}
 else if(mode==='letters'){const l=LETTERS[idx],sc=window.SCENES&&SCENES[idx];hero.className='txt';hero.textContent=l[0];label.innerHTML='<span class="emo"></span><span></span>';label.children[0].textContent=sc?'':l[2];label.children[1].textContent=l[3];if(sc){setScene(sc);later(()=>sceneSound(sc),2600)}anim(hero,'pop-in');SND.jingle(idx);voice('let'+idx,l[1]+'، '+l[3],500);confetti(30)}
 else if(mode==='numbers'){const n=idx+1,e=COUNT_EMO[idx%COUNT_EMO.length];hero.className='txt';hero.style.fontSize='min(30vh,40vw)';hero.textContent=ar(n);label.textContent='';counter.classList.remove('hidden');anim(hero,'pop-in');
  for(let k=1;k<=n;k++)later(()=>{const s=document.createElement('span');s.textContent=e;s.className='pop-in';counter.appendChild(s);SND.pop(1+k*.12);voice('num'+k,NUMW[k],120);if(k===n){later(()=>{label.textContent=NUMW[n];SND.tada();voice('yay'+(1+n%3),'',900);confetti(60)},450)}},500+k*800)}
 if(mode!=='numbers')hero.style.fontSize='';
}
function step(d){if(!mode||mode==='balloons')return;const len=mode==='animals'?ANIMALS.length:mode==='letters'?LETTERS.length:10;idx=(idx+d+len)%len;render()}
function replay(){if(mode==='animals'){animalSound(ANIMALS[idx][2]);anim(hero,'wiggle');voice('n_'+ANIMALS[idx][2],ANIMALS[idx][1],2800);confetti(20)}else if(mode==='letters'){if(!actorYay())SND.jingle(idx);anim(hero,'wiggle');voice('let'+idx,LETTERS[idx][1]+'، '+LETTERS[idx][3],400);confetti(20)}else if(mode==='numbers'){render()}}

/* ---------- balloons ---------- */
let balloons=[],bTimer=null,bRaf=null,lastT=0;
function spawn(){if(balloons.length>=7)return;const el=document.createElement('div');el.className='balloon emo';const a=ANIMALS[Math.floor(Math.random()*ANIMALS.length)];el.textContent=a[0];let col;do{col=COLORS[Math.floor(Math.random()*COLORS.length)]}while(col===COLORS[bgI]);el.style.background=col;el.style.color=col;
 const w=Math.min(innerHeight*.22,innerWidth*.26);const b={el,x:Math.random()*(innerWidth-w),y:innerHeight+20,v:.6+Math.random()*.7,sway:Math.random()*6,a};el.style.left=b.x+'px';el.style.top=b.y+'px';
 el.addEventListener('pointerdown',e=>{e.stopPropagation();popB(b)});document.body.appendChild(el);balloons.push(b)}
function popB(b){if(!balloons.includes(b))return;const r=b.el.getBoundingClientRect();if(r.bottom<=0||r.top>=innerHeight)return;SND.pop(1.2);setTimeout(()=>animalSound(b.a[2]),120);if(Math.random()<.3)voice('yay'+(1+Math.floor(Math.random()*3)),'',1500);confetti(35,r.left+r.width/2,r.top+r.height/2);b.el.remove();balloons=balloons.filter(x=>x!==b);setBg()}
function bLoop(t){const dt=Math.min(50,t-(lastT||t));lastT=t;for(const b of balloons){b.y-=b.v*dt/6;b.sway+=dt/700;b.el.style.top=b.y+'px';b.el.style.transform='translateX('+Math.sin(b.sway)*14+'px)';if(b.y<-innerHeight*.35){b.el.remove();b.gone=true}}balloons=balloons.filter(b=>!b.gone);bRaf=requestAnimationFrame(bLoop)}
function startBalloons(){stopBalloons();setBg();for(let i=0;i<3;i++)setTimeout(spawn,i*400);bTimer=setInterval(spawn,1100);lastT=0;bRaf=requestAnimationFrame(bLoop)}
function stopBalloons(){clearInterval(bTimer);cancelAnimationFrame(bRaf);balloons.forEach(b=>b.el.remove());balloons=[]}
function popTop(){const vis=balloons.filter(b=>{const r=b.el.getBoundingClientRect();return r.top>=0&&r.bottom<=innerHeight});if(!vis.length)return;let best=vis[0];const mid=innerHeight*.45;for(const b of vis){const r=b.el.getBoundingClientRect(),r0=best.el.getBoundingClientRect();if(Math.abs(r.top+r.height/2-mid)<Math.abs(r0.top+r0.height/2-mid))best=b}popB(best)}

/* ---------- input ---------- */
document.querySelectorAll('.tile').forEach(t=>t.onclick=()=>{ac();start(t.dataset.mode)});
$('#homeBtn').onclick=e=>{e.stopPropagation();goHome()};
$('#prevBtn').onclick=e=>{e.stopPropagation();step(-1)};
$('#nextBtn').onclick=e=>{e.stopPropagation();step(1)};
hero.addEventListener('click',e=>{e.stopPropagation();replay()});
$('#stage').addEventListener('click',()=>{if(mode==='balloons')return;step(1)});
const tiles=[...document.querySelectorAll('.tile')];
addEventListener('keydown',e=>{
 const k=e.key;
 if(!mode){const i=tiles.indexOf(document.activeElement);const cols=innerWidth<=700?2:4;
  let j=i<0?0:i;if(k==='ArrowLeft')j=i+1;else if(k==='ArrowRight')j=i-1;else if(k==='ArrowDown')j=i+cols;else if(k==='ArrowUp')j=i-cols;
  if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(k)){e.preventDefault();tiles[Math.max(0,Math.min(tiles.length-1,j))].focus()}
  else if(k==='Enter'||k===' '){e.preventDefault();(document.activeElement.classList.contains('tile')?document.activeElement:tiles[0]).click()}
  return}
 if(k==='Escape'||k==='Backspace'||k==='GoBack'){e.preventDefault();goHome();return}
 e.preventDefault();ac();
 if(mode==='balloons'){popTop();return}
 if(k==='ArrowLeft'||k==='ArrowDown')step(1);else if(k==='ArrowRight'||k==='ArrowUp')step(-1);else if(k==='Enter'||k===' ')replay();
});
window.closeSet=()=>{if(mode)goHome()};
goHome();
}
</script>
</body>
</html>
