<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>رحلة التجويد</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE: هادئ وقور، تحدٍّ جادّ للشباب والكبار
   IDEA: طريق من ألواح حجرية سداسية فوق بحر ليلي، تقفز عليه جوهرة نور مع كل جواب صحيح
   PICTURE: مشهد ثلاثي الأبعاد كامل الشاشة، حروف عربية تسبح في الفضاء
   COLOUR and TYPE: أخضر مصحفي عميق، ذهبي، لون مميز لكل فرع؛ Tajawal للواجهة وAmiri للكلمات القرآنية
   LAYOUT: المشهد في الأعلى، بطاقة السؤال تنزلق من الأسفل */
:root{color-scheme:dark;--bg:#06231c;--ink:#f3efe2;--mut:#a9c2b8;--gold:#e8b84a;--card:rgba(6,32,26,.88);--line:rgba(232,184,74,.28);--ok:#5fd39a;--bad:#ff6b6b;--acc:#e8b84a}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 Tajawal,system-ui,sans-serif;overflow:hidden}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
.scr{position:fixed;inset:0;display:none;flex-direction:column;padding:max(14px,env(safe-area-inset-top)) 16px max(14px,env(safe-area-inset-bottom));pointer-events:none}
.scr.on{display:flex}
.scr>*{pointer-events:auto}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.q{font-family:Amiri,serif;font-size:1.12em;color:var(--acc)}
h1{font-family:Amiri,serif;font-weight:700;font-size:clamp(40px,9vw,64px);line-height:1.05;margin:0;color:var(--gold);text-shadow:0 4px 30px rgba(232,184,74,.35)}
.sub{color:var(--mut);margin:6px 0 0;font-size:16px}
.home-top{text-align:center;margin-top:6vh}
.grid{margin-top:auto;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;max-width:640px;width:100%;align-self:center}
.br{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px 14px;text-align:start;min-height:112px;backdrop-filter:blur(6px);display:flex;flex-direction:column;gap:4px;transition:transform .15s}
.br:active{transform:scale(.97)}
.br b{font-size:20px;font-weight:800}
.br small{color:var(--mut);font-size:13px}
.br .bar{height:6px;border-radius:6px;background:rgba(255,255,255,.1);margin-top:auto;overflow:hidden}
.br .bar i{display:block;height:100%;border-radius:6px}
.hint{text-align:center;color:var(--mut);font-size:13px;margin:12px 0 0}
.top{display:flex;align-items:center;gap:10px}
.back{width:44px;height:44px;border-radius:50%;background:var(--card);border:1px solid var(--line);font-size:20px;flex:none}
.ttl{font-weight:800;font-size:19px;flex:1}
.ttl small{display:block;color:var(--mut);font-weight:500;font-size:13px}
.stg{margin-top:12px;display:grid;gap:10px;max-width:560px;width:100%;align-self:center;overflow:auto;max-height:calc(100vh - 110px);padding-bottom:8px;align-content:start;flex:1}
.pg{color:var(--gold);font-size:13px;opacity:.85}
.rvb{display:block;width:100%;min-height:48px;border-radius:14px;border:1px dashed var(--line);background:rgba(255,255,255,.04);font-weight:700}
#rvL{max-height:calc(100vh - 100px);margin-top:12px;flex:1}
.rv h3{margin:14px 0 6px;font-size:16px;color:var(--acc)}.rv h3:first-child{margin-top:0}
.rv ol{margin:0;padding-inline-start:22px;display:grid;gap:8px}
.rv li{font-size:14.5px;line-height:1.55}
.rv li .a{color:var(--ok);font-weight:700}
.st{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;text-align:start;min-height:64px;backdrop-filter:blur(6px)}
.st .n{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-weight:800;flex:none;color:#06231c}
.st .t{flex:1}.st .t small{display:block;color:var(--mut);font-size:13px}
.st .s{color:var(--gold);letter-spacing:2px;white-space:nowrap}
.st[disabled]{opacity:.45;cursor:not-allowed}
.hud{display:flex;align-items:center;gap:10px}
.pill{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-weight:700;font-size:14px;white-space:nowrap;backdrop-filter:blur(6px)}
.dots{display:flex;gap:4px;justify-content:center;margin-top:10px}
.dots i{width:18px;height:6px;border-radius:4px;background:rgba(255,255,255,.18)}
.dots i.ok{background:var(--ok)}.dots i.bad{background:var(--bad)}.dots i.cur{background:var(--acc)}
.panel{margin-top:auto;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px;max-width:640px;width:100%;align-self:center;backdrop-filter:blur(10px);max-height:62vh;overflow:auto}
.qrow{display:flex;gap:12px;align-items:flex-start}
.qt{font-size:18px;font-weight:700;line-height:1.55;flex:1;margin:0}
.timer{width:44px;height:44px;flex:none}
.opts{display:grid;gap:8px;margin-top:12px}
.op{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:12px 14px;text-align:start;min-height:48px;font-size:16px;line-height:1.45;transition:background .15s,border-color .15s}
.op:hover{background:rgba(255,255,255,.1)}
.op.ok{background:rgba(95,211,154,.18);border-color:var(--ok)}
.op.bad{background:rgba(255,107,107,.18);border-color:var(--bad)}
.op[disabled]{cursor:default}
.fb{display:none;margin-top:12px;border-radius:14px;padding:12px 14px;border:1px solid}
.fb.on{display:block}
.fb.w{background:rgba(255,107,107,.1);border-color:rgba(255,107,107,.5)}
.fb.r{background:rgba(95,211,154,.1);border-color:rgba(95,211,154,.5)}
.fb h3{margin:0 0 4px;font-size:16px}
.fb p{margin:0;font-size:15.5px}
.nx{display:block;width:100%;margin-top:10px;background:var(--acc);color:#06231c;font-weight:800;border-radius:14px;min-height:48px;font-size:17px}
.res{text-align:center}
.big{font-size:44px;color:var(--gold);letter-spacing:6px;line-height:1}
.res h2{margin:8px 0 2px;font-size:24px}
.res p{margin:0;color:var(--mut)}
.mis{text-align:start;margin-top:14px;display:grid;gap:8px}
.mi{background:rgba(255,255,255,.05);border-radius:12px;padding:10px 12px;font-size:14.5px}
.mi b{display:block;margin-bottom:2px}
.mi .a{color:var(--ok);font-weight:700}
.btns{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.btns button{flex:1 1 140px;min-height:48px;border-radius:14px;font-weight:800;border:1px solid var(--line);background:rgba(255,255,255,.06)}
.btns .pr{background:var(--acc);color:#06231c;border:0}
.toast{position:fixed;top:22%;left:50%;transform:translate(-50%,0) scale(.8);font-family:Amiri,serif;font-size:42px;font-weight:700;color:var(--ok);opacity:0;pointer-events:none;transition:all .35s;text-shadow:0 4px 24px rgba(0,0,0,.6)}
.toast.on{opacity:1;transform:translate(-50%,0) scale(1)}
@media(min-width:900px){.panel{max-height:52vh}.qt{font-size:20px}.opts{grid-template-columns:1fr 1fr}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<canvas id="c" aria-hidden="true"></canvas>

<section class="scr on" id="home">
  <div class="home-top">
    <h1>رحلة التجويد</h1>
    <p class="sub">مستخرجة من كتاب «غاية المريد في علم التجويد» للشيخ عطية قابل نصر — أبواب المخارج والصفات واللامات والراءات</p>
  </div>
  <div class="grid" id="brs"></div>
  <p class="hint">اجتز المرحلة بـ٧٠٪ من الإجابات الصحيحة لتفتح التالية · ٣٠ ثانية لكل سؤال · مع كل خطأ شرح ورقم الصفحة</p>
</section>

<section class="scr" id="stages">
  <div class="top"><button class="back" data-go="home" aria-label="رجوع">›</button><div class="ttl" id="stT"></div></div>
  <div class="stg" id="stL"></div>
</section>

<section class="scr" id="review">
  <div class="top"><button class="back" id="rvB" aria-label="رجوع">›</button><div class="ttl" id="rvT"></div></div>
  <div class="panel rv" id="rvL"></div>
</section>

<section class="scr" id="play">
  <div class="hud"><button class="back" id="quit" aria-label="خروج">›</button><div class="ttl" id="plT"></div><span class="pill" id="sc">0</span></div>
  <div class="dots" id="dots"></div>
  <div class="panel">
    <div class="qrow"><p class="qt" id="qt"></p>
      <svg class="timer" viewBox="0 0 44 44"><circle cx="22" cy="22" r="19" fill="none" stroke="rgba(255,255,255,.12)" stroke-width="4"/><circle id="tr" cx="22" cy="22" r="19" fill="none" stroke="var(--acc)" stroke-width="4" stroke-linecap="round" stroke-dasharray="119.4" transform="rotate(-90 22 22)"/><text id="tn" x="22" y="27" text-anchor="middle" fill="currentColor" font-size="14" font-weight="700">30</text></svg>
    </div>
    <div class="opts" id="opts"></div>
    <div class="fb" id="fb"><h3 id="fbh"></h3><p id="fbp"></p><button class="nx" id="nx">التالي</button></div>
  </div>
</section>

<section class="scr" id="result">
  <div class="panel res" id="rs"></div>
</section>
<div class="toast" id="toast">أحسنت</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
{
/* ================= البيانات: [السؤال، الصحيح، خطأ، خطأ، خطأ، الشرح] ================= */

const KEY='tajweed3d_v2';

function show(id){document.querySelectorAll('.scr').forEach(e=>e.classList.toggle('on',e.id===id))}

function renderHome(){

    return `<button class="br" data-b="${k}" style="border-color:${b.col}55"><b style="color:${b.col}">${b.name}</b><small>${AR(b.q.length)} سؤالاً · ${AR(b.st.length)} مراحل</small><small>${AR(t)} / ${AR(mx)} نجمة</small><span class="bar"><i style="width:${t/mx*100}%;background:${b.col}"></i></span></button>`}).join('');

  $('stL').innerHTML=b.st.map((n,i)=>{const open=i===0||stars(b.id,i-1)>0,s=stars(b.id,i);

function start(k,s){

function dots(){$('dots').innerHTML=cur.qs.map((_,i)=>`<i class="${cur.res[i]===1?'ok':cur.res[i]===0?'bad':i===cur.i?'cur':''}"></i>`).join('')}

  const ops=shuf([1,2,3,4]);
  $('opts').innerHTML=ops.map(j=>`<button class="op" data-j="${j}">${fmt(q[j])}</button>`).join('');

function tick(){$('tn').textContent=AR(Math.max(0,tLeft));$('tr').style.strokeDashoffset=119.4*(1-tLeft/30);$('tr').style.stroke=tLeft<=8?'var(--bad)':'var(--acc)'}
function answer(j){
  if(locked)return;locked=true;clearInterval(timer);
  const q=cur.qs[cur.i],ok=j===1;
  document.querySelectorAll('.op').forEach(o=>{o.disabled=true;const d=+o.dataset.j;if(d===1)o.classList.add('ok');else if(d===j)o.classList.add('bad')});
  cur.res[cur.i]=ok?1:0;dots();

    S3.mark(cur.i,true);const t=$('toast');t.textContent=cur.streak>=3?`أحسنت · ${AR(cur.streak)} متتالية`:'أحسنت';t.classList.add('on');

function next(){

}

  const hasNext=st>0&&cur.s<b.st.length-1;
  $('rs').innerHTML=`<div class="big">${'★'.repeat(st)}${'☆'.repeat(3-st)}</div>
  <h2>${st?(c===10?'إتقان تام':'اجتزت المرحلة'):'لم تكتمل المرحلة'}</h2>
  <p>${AR(c)} من ${AR(n)} صحيحة · النقاط ${AR(cur.score)}${st?'':' · تحتاج '+AR(need)+' إجابات صحيحة'}</p>
  ${cur.mis.length?`<div class="mis"><b style="font-size:15px">راجع أخطاءك</b>${cur.mis.map(q=>`<div class="mi"><b>${fmt(q[0])}</b><span class="a">${fmt(q[1])}</span> — ${fmt(q[5])} <small class="pg">ص${AR(q[6])}</small></div>`).join('')}</div>`:''}
  <div class="btns">${hasNext?`<button class="pr" id="goN">المرحلة التالية</button>`:''}<button ${hasNext?'':'class="pr"'} id="goR">أعد المرحلة</button><button id="goS">المراحل</button></div>`;
  show('result');
  $('goR').onclick=()=>start(cur.k,cur.s);$('goS').onclick=()=>renderStages(cur.k);
  if(hasNext)$('goN').onclick=()=>start(cur.k,cur.s+1);
}

  const br=e.target.closest('.br');if(br)return renderStages(+br.dataset.b);
  const st=e.target.closest('.st');if(st&&!st.disabled)return start(+st.dataset.b,+st.dataset.s);
  const op=e.target.closest('.op');if(op&&!op.disabled)return answer(+op.dataset.j);
  const rv=e.target.closest('[data-rv]');if(rv)return review(+rv.dataset.rv);
  const g=e.target.closest('[data-go]');if(g)return renderHome();
});
$('nx').onclick=next;
let rvK=0;$('rvB').onclick=()=>renderStages(rvK);
function review(k){rvK=k;const b=B[k];
  $('rvT').innerHTML=`<span style="color:${b.col}">${b.name}</span><small>${AR(b.q.length)} سؤالاً · ${b.desc}</small>`;
  $('rvL').innerHTML=b.st.map((n,i)=>`<h3>المرحلة ${AR(i+1)}: ${n}</h3><ol start="${b.off[i]+1}">${b.q.slice(b.off[i],b.off[i]+b.sz[i]).map(q=>`<li>${fmt(q[0])} <span class="a">${fmt(q[1])}</span> <small class="pg">ص${AR(q[6])}</small></li>`).join('')}</ol>`).join('');
  show('review');$('rvL').scrollTop=0}
$('quit').onclick=()=>{clearInterval(timer);renderStages(cur.k)};
document.addEventListener('keydown',e=>{if($('play').classList.contains('on')&&!locked&&/^[1-4]$/.test(e.key)){const o=document.querySelectorAll('.op')[+e.key-1];if(o)o.click()}});

/* ================= المشهد ثلاثي الأبعاد ================= */
const S3=(()=>{
  const ok=typeof THREE!=='undefined';
  const api={mode(){},build(){},mark(){},hop(){}};
  if(!ok)return api;
  const cv=$('c'),R=new THREE.WebGLRenderer({canvas:cv,antialias:true});
  R.setPixelRatio(Math.min(devicePixelRatio,2));
  const sc=new THREE.Scene();sc.background=new THREE.Color('#06231c');sc.fog=new THREE.Fog('#06231c',14,46);
  const cam=new THREE.PerspectiveCamera(55,1,.1,200);
  sc.add(new THREE.HemisphereLight('#bfe8d8','#062018',.75));
  const sun=new THREE.DirectionalLight('#ffe2a8',.9);sun.position.set(-6,12,8);sc.add(sun);
  // بحر
  const sea=new THREE.Mesh(new THREE.CircleGeometry(80,64),new THREE.MeshStandardMaterial({color:'#0a3b31',roughness:.35,metalness:.4}));
  sea.rotation.x=-Math.PI/2;sea.position.y=-1.2;sc.add(sea);
  // نجوم
  const sg=new THREE.BufferGeometry(),sp=[];for(let i=0;i<700;i++){sp.push((Math.random()-.5)*120,Math.random()*40+4,(Math.random()-.5)*120-20)}
  sg.setAttribute('position',new THREE.Float32BufferAttribute(sp,3));
  sc.add(new THREE.Points(sg,new THREE.PointsMaterial({color:'#f3dfa0',size:.14,transparent:true,opacity:.8})));
  // حروف عائمة
  const letters='ء ه ع ح غ خ ق ك ج ش ي ض ل ن ر ط د ت ص ز س ظ ذ ث ف ب م و'.split(' ');
  const floaters=[];
  function letterTex(ch){const c=document.createElement('canvas');c.width=c.height=128;const x=c.getContext('2d');
    x.fillStyle='#e8b84a';x.font='700 96px Amiri, serif';x.textAlign='center';x.textBaseline='middle';x.shadowColor='#e8b84a';x.shadowBlur=14;x.fillText(ch,64,70);
    return new THREE.CanvasTexture(c)}
  function makeLetters(){letters.forEach((ch,i)=>{const m=new THREE.Sprite(new THREE.SpriteMaterial({map:letterTex(ch),transparent:true,opacity:.55,depthWrite:false}));
    const a=i/letters.length*Math.PI*2,r=9+Math.random()*7;m.userData={a,r,h:1.5+Math.random()*6,sp:.02+Math.random()*.04};
    m.scale.setScalar(1.1+Math.random()*.8);sc.add(m);floaters.push(m)})}
  (document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve()).then(makeLetters);
  // الطريق
  const path=new THREE.Group();sc.add(path);
  let N=10;const P=i=>new THREE.Vector3(Math.sin(i*.85)*2.4,i===N?.3:0,-i*2.6);
  let plats=[],gate=null,accent=new THREE.Color('#e8b84a');
  const hex=new THREE.CylinderGeometry(.95,1.05,.42,6);
  function build(col,n){N=n||10;
    accent=new THREE.Color(col||'#e8b84a');
    while(path.children.length)path.remove(path.children[0]);plats=[];
    for(let i=0;i<N;i++){const m=new THREE.Mesh(hex,new THREE.MeshStandardMaterial({color:'#3d5a50',roughness:.8,metalness:.1,emissive:'#000'}));
      const p=P(i);m.position.copy(p);m.userData.base=p.y;path.add(m);plats.push(m);
      const ring=new THREE.Mesh(new THREE.TorusGeometry(.98,.04,6,6),new THREE.MeshBasicMaterial({color:accent,transparent:true,opacity:.35}));
      ring.rotation.x=Math.PI/2;ring.rotation.z=Math.PI/6;ring.position.set(p.x,p.y+.23,p.z);path.add(ring);m.userData.ring=ring;}
    // بوابة النهاية
    const gp=P(N);gate=new THREE.Group();
    const base=new THREE.Mesh(new THREE.CylinderGeometry(1.6,1.8,.5,8),new THREE.MeshStandardMaterial({color:'#2a4a40',roughness:.7}));gate.add(base);
    const arch=new THREE.Mesh(new THREE.TorusGeometry(1.25,.16,10,32,Math.PI),new THREE.MeshStandardMaterial({color:accent,emissive:accent,emissiveIntensity:.35,metalness:.5,roughness:.3}));
    arch.position.y=.25;gate.add(arch);
    gate.position.copy(gp);path.add(gate);
    orb.position.copy(P(0)).add(new THREE.Vector3(0,.75,0));orbPos=0;hopT=1;
    mode('play');highlight(0);
  }
  // الجوهرة
  const orb=new THREE.Mesh(new THREE.IcosahedronGeometry(.36,1),new THREE.MeshStandardMaterial({color:'#fff3c4',emissive:'#e8b84a',emissiveIntensity:.9,roughness:.2,metalness:.3,flatShading:true}));
  const glow=new THREE.PointLight('#ffd97a',1.4,7);orb.add(glow);sc.add(orb);
  let orbPos=0,hopFrom=new THREE.Vector3(),hopTo=new THREE.Vector3(),hopT=1,shakeT=0,md='home';
  function highlight(i){plats.forEach((p,k)=>{if(p.userData.st)return;p.material.emissive.set(k===i?accent:'#000');p.material.emissiveIntensity=k===i?.25:0})}
  function mark(i,good){const p=plats[i];if(!p)return;p.userData.st=good?1:2;
    p.material.color.set(good?accent:'#7a2c2c');p.material.emissive.set(good?accent:'#ff4d4d');p.material.emissiveIntensity=good?.45:.35;
    p.userData.ring.material.color.set(good?accent:'#ff6b6b');p.userData.ring.material.opacity=.8;if(!good)shakeT=.5}
  function hop(i){hopFrom.copy(orb.position);hopTo.copy(P(i)).add(new THREE.Vector3(0,i===N?1.1:.75,0));hopT=0;orbPos=i;highlight(i)}
  function mode(m,col){md=m;if(m==='home'){if(!plats.length)build(col);md='home';}}
  function size(){const w=innerWidth,h=innerHeight;R.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix()}
  addEventListener('resize',size);size();
  const camPos=new THREE.Vector3(6,7,10),look=new THREE.Vector3();
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  let t0=performance.now();
  function loop(now){
    const dt=Math.min(.05,(now-t0)/1000);t0=now;const T=now/1000;
    if(hopT<1){hopT=Math.min(1,hopT+dt/(reduce?.01:.55));const e=hopT<.5?2*hopT*hopT:1-Math.pow(-2*hopT+2,2)/2;
      orb.position.lerpVectors(hopFrom,hopTo,e);orb.position.y+=Math.sin(hopT*Math.PI)*1.4}
    else{const b=P(orbPos);orb.position.y=b.y+(orbPos===N?1.1:.75)+Math.sin(T*2.2)*.08}
    if(shakeT>0){shakeT-=dt;orb.position.x+=Math.sin(T*60)*.06*shakeT/.5}
    orb.rotation.y+=dt*1.2;orb.rotation.x+=dt*.5;
    plats.forEach((p,k)=>{p.position.y=p.userData.base+Math.sin(T*1.3+k)*.05;p.userData.ring.position.y=p.position.y+.23});
    if(gate)gate.rotation.y=Math.sin(T*.4)*.15;
    floaters.forEach(f=>{const u=f.userData;u.a+=u.sp*dt*(reduce?0:1);f.position.set(Math.cos(u.a)*u.r,u.h+Math.sin(T+u.r)*.4,Math.sin(u.a)*u.r-12)});
    let tp,tl;
    if(md==='home'){const a=T*(reduce?0:.08);tp=new THREE.Vector3(Math.cos(a)*16,9,-12+Math.sin(a)*16);tl=new THREE.Vector3(0,0,-12)}
    else{tp=orb.position.clone().add(new THREE.Vector3(0,5.2,7.4));tl=orb.position.clone().add(new THREE.Vector3(0,-4.6,-3.5))}
    camPos.lerp(tp,1-Math.pow(.02,dt));look.lerp(tl,1-Math.pow(.02,dt));cam.position.copy(camPos);cam.lookAt(look);
    R.render(sc,cam);requestAnimationFrame(loop)}
  requestAnimationFrame(loop);
  return{mode,build,mark,hop};
})();

renderHome();
}
