<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>حراس الإعراب</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Noto+Kufi+Arabic:wght@400;600;800&display=swap" rel="stylesheet">
<style>
/* VOICE: لعبة مغامرة للشباب، ليلية وجادة، ليست طفولية
   IDEA: جسر حجري معلّق فوق وادٍ في ليل صحراوي، تعترضه بوابات مغلقة بجمل عربية
   PICTURE: المشهد ثلاثي الأبعاد نفسه يملأ الشاشة، والبطاقة أسفلها
   COLOUR and TYPE: ليل نيلي، رمل ذهبي، فيروزي للصواب، وردي للخطأ — Amiri للجمل، Noto Kufi للواجهة
   LAYOUT: مشهد كامل، شريط علوي للقلوب والنقاط، بطاقة سفلية للأسئلة */
:root{color-scheme:dark;--night:#15122e;--glass:rgba(22,18,48,.92);--sand:#f0c873;--teal:#43d6c8;--rose:#ff6b6b;--ink:#f3ecff;--mute:#b9b0d8}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--night);color:var(--ink);font:16px/1.6 "Noto Kufi Arabic",Tahoma,sans-serif;overflow:hidden}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
.hud{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top) + 10px) 12px 6px;pointer-events:none;z-index:2}
.chip{background:var(--glass);border:1px solid #ffffff1f;border-radius:999px;padding:5px 12px;font-size:14px;font-weight:600;display:flex;align-items:center;gap:5px;white-space:nowrap}
.chip svg{width:18px;height:18px}
.chip .lost{opacity:.22}
#streak{color:var(--sand)}
.timer{position:relative;height:6px;border-radius:6px;background:#ffffff1a;overflow:hidden;margin:2px 4px 12px}
.timer i{display:block;height:100%;width:100%;background:var(--teal);margin-inline-start:auto}
.boss{position:fixed;top:calc(env(safe-area-inset-top) + 52px);left:0;right:0;text-align:center;z-index:2;font-weight:800;color:var(--rose);font-size:14px;pointer-events:none}
.boss span{display:inline-block;width:34px;height:8px;border-radius:4px;background:var(--rose);margin:0 3px;vertical-align:middle;transition:opacity .3s}
.boss span.x{opacity:.18}
#card{position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:640px;background:var(--glass);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-top:2px solid var(--sand);border-radius:22px 22px 0 0;padding:14px 16px calc(env(safe-area-inset-bottom) + 16px);transform:translateY(115%);transition:transform .45s cubic-bezier(.2,.8,.2,1);z-index:3}
#card.on{transform:none}
.sent{font:700 clamp(26px,7.5vw,36px)/1.75 Amiri,serif;text-align:center;margin:0}
.sent .tg{color:var(--sand);border-bottom:3px dotted var(--sand);padding:0 2px}
.sent .dim{opacity:.5}.sent .ok{color:var(--teal)}.sent .no{color:var(--rose)}
.ask{margin:2px 0 12px;text-align:center;color:var(--mute);font-size:15px}
.opts{display:grid;gap:10px}.opts.r{grid-template-columns:1fr 1fr}.opts.m{grid-template-columns:repeat(3,1fr)}
button{font:600 16px "Noto Kufi Arabic",sans-serif;color:var(--ink);background:#2b2555;border:1px solid #ffffff24;border-radius:14px;min-height:52px;padding:8px;cursor:pointer;transition:transform .12s,background .2s}
button:active{transform:scale(.96)}
button:focus-visible{outline:3px solid var(--sand);outline-offset:2px}
.opts.m button{display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.25;font-size:14px;min-height:64px}
.opts.m b{font:700 30px/1 Amiri,serif;color:var(--sand);height:30px}
.good{background:#1d6a62!important;border-color:var(--teal)!important}
.bad{background:#6d1f30!important;border-color:var(--rose)!important}
.res{text-align:center}
.res h3{margin:0;font-size:22px;font-weight:800}
.res .w{font:700 40px/1.5 Amiri,serif;margin:0}
.res p{margin:4px 0 14px;color:var(--ink);font-size:15px}
.res .pts{color:var(--sand);font-weight:800}
.main{background:var(--sand);color:#2a1e05;width:100%;font-weight:800;font-size:18px;border:0}
.screen{position:fixed;inset:0;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 50% 35%,rgba(21,18,46,.35),rgba(21,18,46,.92) 70%);z-index:5}
.screen[hidden],[hidden]{display:none!important}
.panel{max-width:440px;width:100%;text-align:center}
h1{font:700 clamp(48px,14vw,72px)/1.1 Amiri,serif;color:var(--sand);margin:0;text-wrap:balance}
h2{font-size:18px;font-weight:600;color:var(--teal);margin:6px 0 18px}
.rules{list-style:none;padding:0;margin:0 0 22px;color:var(--ink);font-size:15px;line-height:2}
.rules b{color:var(--sand)}
.note{font-size:13px;color:var(--mute);margin-top:12px}
.big{font:800 52px/1.1 "Noto Kufi Arabic";color:var(--sand);margin:8px 0}
.stars svg{width:46px;height:46px;margin:0 4px}
.stats{display:flex;justify-content:center;gap:22px;margin:4px 0 20px;color:var(--mute);font-size:14px}
.stats b{display:block;color:var(--ink);font-size:20px}
#flash{position:fixed;inset:0;background:var(--rose);opacity:0;pointer-events:none;transition:opacity .5s;z-index:4}
@media (prefers-reduced-motion:reduce){#card{transition:none}}
.alt{margin-top:10px;background:transparent;color:var(--sand);border:2px solid var(--sand)}
.sec{margin-top:10px;width:100%;background:transparent;border:0;color:var(--mute);font-size:15px;min-height:46px;text-decoration:underline}
</style>
</head>
<body>
<canvas id="c"></canvas>
<header class="hud">
  <div class="chip" id="hearts"></div>
  <div class="chip" id="prog"></div>
  <div class="chip"><span id="streak"></span><span id="score">0</span></div>
</header>
<div class="boss" id="boss" hidden>حارس الجسر <span></span><span></span><span></span></div>

<section id="card" aria-live="polite">
  <div class="timer" id="timer" hidden><i></i></div>
  <div id="q">
    <p class="sent" id="sent"></p>
    <p class="ask" id="ask"></p>
    <div class="opts r" id="opts"></div>
  </div>
  <div class="res" id="res" hidden>
    <h3 id="rt"></h3>
    <p class="w" id="rw"></p>
    <p id="rx"></p>
    <button class="main" id="next">تابع</button>
  </div>
</section>

<div class="screen" id="start">
  <div class="panel">
    <h1>حُرّاس الإعراب</h1>
    <h2>العالم الأول: جسر المرفوعات</h2>
    <ul class="rules">
      <li>كل بوابة مغلقة بجملة فيها <b>كلمة مضيئة</b></li>
      <li>حدّد <b>موقعها</b> ثم <b>علامة إعرابها</b> قبل نفاد الوقت</li>
      <li>معك <b>ثلاثة قلوب</b> فقط، واحذر الفخاخ والحارس الأخير</li>
    </ul>
    <button class="main" id="go">ابدأ الرحلة</button>
    <p class="note">نموذج تجريبي — ١١ بوابة وحارس</p>
    <button class="sec home">العودة إلى المنصة</button>
  </div>
</div>

<div class="screen" id="end" hidden>
  <div class="panel">
    <h1 id="et"></h1>
    <div class="stars" id="stars"></div>
    <p class="big" id="es"></p>
    <div class="stats"><div><b id="ea"></b>الدقة</div><div><b id="eb"></b>أفضل نتيجة</div></div>
    <button class="main" id="nextw" hidden>العالم التالي</button>
    <button class="main alt" id="again">العب مجددًا</button>
    <button class="sec home">العودة إلى المنصة</button>
  </div>
</div>
<div id="flash"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
{
const WORLD=1;
const $=s=>document.querySelector(s);
const ROLES=['فاعل','مبتدأ','خبر','نائب فاعل','مفعول به','فعل مضارع'];
const MARKS=[['الضمة','ـُ'],['الفتحة','ـَ'],['الكسرة','ـِ'],['الواو','و'],['الألف','ا'],['الياء','ي']];
const MCOL={'الضمة':0x43d6c8,'الفتحة':0xf0c873,'الكسرة':0xff8fb1,'الواو':0x8fb8ff,'الألف':0xb8ff8f,'الياء':0xffb36b};
const G=[
 {w:['حَضَرَ','المعلم','مُبَكِّرًا'],ts:[{t:1,r:'فاعل',m:'الضمة',d:'المعلمُ',ex:'«المعلمُ» هو من قام بالحضور، فهو فاعل مرفوع وعلامة رفعه الضمة الظاهرة.'}]},
 {w:['الصدق','مَنْجَاةٌ'],ts:[{t:0,r:'مبتدأ',m:'الضمة',d:'الصدقُ',ex:'اسم مرفوع بدأنا به الجملة الاسمية، فهو مبتدأ مرفوع بالضمة.'}]},
 {w:['العِلْمُ','نور'],ts:[{t:1,r:'خبر',m:'الضمة',d:'نورٌ',ex:'أتمّ معنى المبتدأ «العلمُ»، فهو خبر مرفوع بالضمة.'}]},
 {w:['كُتِبَ','الدرس'],ts:[{t:1,r:'نائب فاعل',m:'الضمة',d:'الدرسُ',ex:'الفعل «كُتِبَ» مبني للمجهول، فما بعده نائب فاعل مرفوع بالضمة.'}]},
 {w:['فَازَ','المجتهدون'],ts:[{t:1,r:'فاعل',m:'الواو',d:'المجتهدونَ',ex:'فاعل، وهو جمع مذكر سالم يُرفع بالواو نيابة عن الضمة.'}]},
 {w:['نَجَحَ','الطالبان'],ts:[{t:1,r:'فاعل',m:'الألف',d:'الطالبانِ',ex:'فاعل، وهو مثنى يُرفع بالألف نيابة عن الضمة.'}]},
 {w:['يكتب','الطالبُ','الدرسَ'],ts:[{t:0,r:'فعل مضارع',m:'الضمة',d:'يكتبُ',ex:'فعل مضارع لم يسبقه ناصب ولا جازم، فهو مرفوع بالضمة.'}]},
 {w:['أَكْرَمَ','المُعَلِّمَ','الطالب'],ts:[{t:2,r:'فاعل',m:'الضمة',d:'الطالبُ',ex:'فخّ! «المعلمَ» منصوب فهو المفعول به المقدَّم، و«الطالبُ» فاعل مؤخَّر مرفوع بالضمة.'}]},
 {w:['أَكْرَمَ','المعلم','الطالبُ'],ts:[{t:1,r:'مفعول به',m:'الفتحة',d:'المعلمَ',ex:'فخّ معاكس! الفاعل هو «الطالبُ» المرفوع، فـ«المعلمَ» مفعول به مقدَّم منصوب بالفتحة.'}]},
 {w:['جَاءَ','أبوك','مُسْرِعًا'],ts:[{t:1,r:'فاعل',m:'الواو',d:'أبوكَ',ex:'«أبو» من الأسماء الخمسة، تُرفع بالواو نيابة عن الضمة.'}]},
 {w:['المؤمنونَ','متحابون'],ts:[{t:1,r:'خبر',m:'الواو',d:'متحابّونَ',ex:'خبر للمبتدأ «المؤمنونَ»، وهو جمع مذكر سالم مرفوع بالواو.'}]},
 {boss:true,w:['قَالَ','أبوك',':','المجتهدون','فائزون'],ts:[
   {t:1,r:'فاعل',m:'الواو',d:'أبوكَ',ex:'فاعل للفعل «قال»، مرفوع بالواو لأنه من الأسماء الخمسة.'},
   {t:3,r:'مبتدأ',m:'الواو',d:'المجتهدونَ',ex:'بداية جملة اسمية جديدة، فهو مبتدأ مرفوع بالواو لأنه جمع مذكر سالم.'},
   {t:4,r:'خبر',m:'الواو',d:'فائزونَ',ex:'خبر المبتدأ «المجتهدونَ»، مرفوع بالواو لأنه جمع مذكر سالم.'}]}
];
const N=G.length,GAP=16,TIME=25,BTIME=15;
const st={g:0,k:0,step:'role',hearts:3,score:0,streak:0,correct:0,total:0,left:TIME,max:TIME,run:false};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const gz=i=>-(i+1)*GAP;

/* ---------- المشهد ---------- */
const cv=$('#c');
const ren=new THREE.WebGLRenderer({canvas:cv,antialias:true});
ren.setPixelRatio(Math.min(devicePixelRatio,2));
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x1b1740);
scene.fog=new THREE.Fog(0x1b1740,20,75);
const cam=new THREE.PerspectiveCamera(58,1,.1,400);
scene.add(new THREE.HemisphereLight(0xffd9a0,0x1a1440,.8));
const moonL=new THREE.DirectionalLight(0xc6d4ff,.75);moonL.position.set(-10,20,12);scene.add(moonL);
const M=(c,e=0)=>new THREE.MeshStandardMaterial({color:c,roughness:.85,emissive:e?c:0,emissiveIntensity:e});
const stA=M(0x6e5c80),stB=M(0x5b4b6e),railM=M(0x46395e),glowS=M(0xf0c873,1.4);
const plank=new THREE.BoxGeometry(4.4,.5,1.85);
const L=N*GAP+26,endZ=-(N*GAP+14);
for(let z=8,i=0;z>endZ;z-=2,i++){const p=new THREE.Mesh(plank,i%2?stA:stB);p.position.set(0,-.25,z);scene.add(p)}
[-1,1].forEach(x=>{const r=new THREE.Mesh(new THREE.BoxGeometry(.3,.6,L),railM);r.position.set(x*2.3,.3,8-L/2);scene.add(r)});
const postG=new THREE.BoxGeometry(.16,1.7,.16),bulbG=new THREE.SphereGeometry(.2,12,10),legG=new THREE.BoxGeometry(1.2,34,1.2);
for(let z=4;z>endZ;z-=8){[-1,1].forEach(x=>{const p=new THREE.Mesh(postG,railM);p.position.set(x*2.3,1.15,z);scene.add(p);const b=new THREE.Mesh(bulbG,glowS);b.position.set(x*2.3,2.1,z);scene.add(b);const l=new THREE.Mesh(legG,stB);l.position.set(x*1.6,-17.5,z);scene.add(l)})}
{const n=900,pos=new Float32Array(n*3);for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,y=Math.random()*90+5,r=120+Math.random()*60;pos.set([Math.cos(a)*r,y,Math.sin(a)*r-60],i*3)}
const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(pos,3));scene.add(new THREE.Points(g,new THREE.PointsMaterial({color:0xfff5dc,size:.7,fog:false})))}
const moon=new THREE.Mesh(new THREE.SphereGeometry(7,32,24),new THREE.MeshBasicMaterial({color:0xfff1c9,fog:false}));moon.position.set(-45,48,-170);scene.add(moon);
const dune=M(0x2a2352);for(let i=0;i<26;i++){const s=8+Math.random()*16,c=new THREE.Mesh(new THREE.ConeGeometry(s,s*1.1,5),dune);const side=i%2?1:-1;c.position.set(side*(30+Math.random()*40),-14+s*.5,10-Math.random()*(L+60));c.rotation.y=Math.random()*3;scene.add(c)}
const abyss=new THREE.Mesh(new THREE.PlaneGeometry(400,400),new THREE.MeshBasicMaterial({color:0x0c0a1e}));abyss.rotation.x=-Math.PI/2;abyss.position.y=-34;scene.add(abyss);

/* البوابات */
const gates=G.map((q,i)=>{
  const g=new THREE.Group();g.position.z=gz(i);const s=q.boss?1.3:1;
  const pm=q.boss?M(0x7a3352):M(0x8a7194);
  [-1,1].forEach(x=>{const p=new THREE.Mesh(new THREE.BoxGeometry(1,7*s,1),pm);p.position.set(x*2.7*s,3.5*s,0);g.add(p)});
  const lin=new THREE.Mesh(new THREE.BoxGeometry(6.6*s,1,1.4),pm);lin.position.y=7*s+.5;g.add(lin);
  const dm=q.boss?M(0xff5470,.35):M(0xd49a4a,.22);
  const doors=[-1,1].map(x=>{const d=new THREE.Mesh(new THREE.BoxGeometry(2.25*s,6.4*s,.3),dm);d.position.set(x*1.12*s,3.2*s,0);d.userData={x0:x*1.12*s,x1:x*4.2*s};g.add(d);return d});
  const pc=document.createElement('canvas');pc.width=1024;pc.height=256;
  const tex=new THREE.CanvasTexture(pc);
  const panel=new THREE.Mesh(new THREE.PlaneGeometry(7.6,1.9),new THREE.MeshBasicMaterial({map:tex,transparent:true,fog:false}));
  panel.position.y=7*s+2.2;g.add(panel);
  scene.add(g);return{g,doors,pc,tex,panel,open:false,pulse:0};
});
const bossI=N-1;
const guard=new THREE.Mesh(new THREE.OctahedronGeometry(1.4,0),new THREE.MeshStandardMaterial({color:0xff3d68,emissive:0xff3d68,emissiveIntensity:.8,flatShading:true}));
const guardEye=new THREE.Mesh(new THREE.SphereGeometry(.45,16,12),new THREE.MeshBasicMaterial({color:0xfff1c9}));guardEye.position.z=1.1;guard.add(guardEye);
const g0=new THREE.Vector3(0,14.6,gz(bossI)+.5);guard.position.copy(g0);scene.add(guard);
let guardHit=0,guardFall=false,guardVy=0;

/* اللاعب */
const pl=new THREE.Group();
const body=new THREE.Mesh(new THREE.CylinderGeometry(.32,.58,1.35,16),M(0x2fa89d));body.position.y=.9;
const head=new THREE.Mesh(new THREE.SphereGeometry(.32,20,16),M(0xf3d6a8));head.position.y=1.86;
const cap=new THREE.Mesh(new THREE.SphereGeometry(.35,20,12,0,Math.PI*2,0,Math.PI/2),M(0xf4f1ff));cap.position.y=1.93;
const orb=new THREE.Mesh(new THREE.SphereGeometry(.16,14,10),new THREE.MeshBasicMaterial({color:0x43d6c8}));orb.position.set(.62,1.45,-.1);
const ring=new THREE.Mesh(new THREE.TorusGeometry(.75,.05,8,40),new THREE.MeshBasicMaterial({color:0x43d6c8}));ring.rotation.x=Math.PI/2;ring.position.y=.05;
const pLight=new THREE.PointLight(0x43d6c8,1.3,9);pLight.position.y=2.4;
pl.add(body,head,cap,orb,ring,pLight);scene.add(pl);
let tz=gz(0)+7;pl.position.z=tz;

function drawPanel(i){
  const q=G[i],c=gates[i].pc.getContext('2d');c.clearRect(0,0,1024,256);
  c.fillStyle='rgba(21,18,46,.9)';c.strokeStyle=q.boss?'#ff5470':'#f0c873';c.lineWidth=6;
  c.beginPath();c.roundRect?c.roundRect(8,8,1008,240,36):c.rect(8,8,1008,240);c.fill();c.stroke();
  const words=q.w.map((w,j)=>{const ti=q.ts.findIndex(x=>x.t===j);if(ti<0)return{w,c:'#efe6ff'};const T=q.ts[ti];
    if(T.ok!==undefined)return{w:T.d,c:T.ok?'#43d6c8':'#ff6b6b'};return{w,c:(i===st.g&&ti===st.k)?'#f0c873':'rgba(240,200,115,.55)',u:1}});
  let size=96;const setF=()=>c.font=`700 ${size}px Amiri, serif`;setF();
  const tot=()=>words.reduce((a,x)=>a+c.measureText(x.w).width,0)+c.measureText(' ').width*(words.length-1);
  let t=tot();if(t>920){size=Math.floor(size*920/t);setF();t=tot()}
  c.direction='rtl';c.textAlign='right';c.textBaseline='middle';
  let x=512+t/2;const sp=c.measureText(' ').width;
  words.forEach(o=>{const wd=c.measureText(o.w).width;c.fillStyle=o.c;c.fillText(o.w,x,122);if(o.u)c.fillRect(x-wd,122+size*.5,wd,6);x-=wd+sp});
  gates[i].tex.needsUpdate=true;
}

/* المقذوفات */
const shots=[];
function shoot(col,target,cb){const m=new THREE.Mesh(new THREE.SphereGeometry(.3,16,12),new THREE.MeshBasicMaterial({color:col}));
  const a=new THREE.Vector3();orb.getWorldPosition(a);const b=new THREE.Vector3();target.getWorldPosition(b);
  m.position.copy(a);scene.add(m);shots.push({m,a,b,t:0,cb})}

/* ---------- الواجهة ---------- */
const heartSVG=c=>`<svg viewBox="0 0 24 24" class="${c}"><path fill="#ff6b6b" d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 3 4.5 6.6 4.5c2.1 0 3.7 1.2 5.4 3.2 1.7-2 3.3-3.2 5.4-3.2 3.6 0 5.7 3.9 4.2 7.3C19.5 16.4 12 21 12 21z"/></svg>`;
const starSVG=on=>`<svg viewBox="0 0 24 24"><path fill="${on?'#f0c873':'#ffffff26'}" d="M12 2l3 6.6 7.2.8-5.4 4.9 1.5 7.1L12 17.8 5.7 21.4l1.5-7.1L1.8 9.4 9 8.6z"/></svg>`;
function hud(){
  $('#hearts').innerHTML=[0,1,2].map(i=>heartSVG(i<st.hearts?'':'lost')).join('');
  $('#prog').textContent=G[st.g]&&G[st.g].boss?'الحارس':`البوابة ${Math.min(st.g+1,N-1)} من ${N-1}`;
  $('#score').textContent=st.score.toLocaleString('ar');
  $('#streak').textContent=st.streak>=2?`سلسلة ×${st.streak.toLocaleString('ar')} ·`:'';
  const b=G[st.g]&&G[st.g].boss;$('#boss').hidden=!b;
  if(b)[...$('#boss').querySelectorAll('span')].forEach((s,i)=>s.classList.toggle('x',i<guardHit));
}
const cur=()=>G[st.g].ts[st.k];
function renderSent(){const q=G[st.g];
  $('#sent').innerHTML=q.w.map((w,j)=>{const ti=q.ts.findIndex(x=>x.t===j);if(ti<0)return`<span>${w}</span>`;const T=q.ts[ti];
    if(T.ok!==undefined)return`<span class="${T.ok?'ok':'no'}">${T.d}</span>`;return`<span class="tg${ti===st.k?'':' dim'}">${w}</span>`}).join(' ')}
function showQ(){
  const q=G[st.g],T=cur();st.step='role';st.left=st.max=q.boss?BTIME:TIME;st.run=true;
  renderSent();$('#ask').textContent='ما موقع الكلمة المضيئة من الإعراب؟';
  const opts=shuffle([T.r,...shuffle(ROLES.filter(r=>r!==T.r)).slice(0,3)]);
  $('#opts').className='opts r';$('#opts').innerHTML=opts.map(r=>`<button data-r="${r}">${r}</button>`).join('');
  $('#q').hidden=false;$('#res').hidden=true;$('#card').classList.add('on');$('#timer').hidden=false;
  drawPanel(st.g);hud();
}
function showMarks(){
  $('#ask').textContent=`صحيح، ${cur().r}. فما علامة إعرابه؟`;
  $('#opts').className='opts m';$('#opts').innerHTML=MARKS.map(([n,g])=>`<button data-m="${n}"><b>${g}</b>${n}</button>`).join('');
}
$('#opts').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b||!st.run)return;const T=cur();
  if(st.step==='role'){
    if(b.dataset.r===T.r){b.classList.add('good');st.step='wait';setTimeout(()=>{st.step='mark';showMarks()},280)}
    else if(st.step==='role'){b.classList.add('bad');resolve(false,'role')}
  }else if(st.step==='mark'){
    if(b.dataset.m===T.m){b.classList.add('good');resolve(true)}else{b.classList.add('bad');resolve(false,'mark')}
  }
});
let shake=0;
function resolve(ok,why){
  st.run=false;st.step='done';const T=cur();T.ok=ok;st.total++;let msg;
  if(ok){
    st.streak++;st.correct++;const pts=Math.round((100+Math.ceil(st.left)*5)*(1+Math.min(st.streak-1,4)*.25));st.score+=pts;
    shoot(MCOL[T.m],G[st.g].boss?guard:gates[st.g].panel,()=>{gates[st.g].pulse=1;drawPanel(st.g);if(G[st.g].boss){guardHit++;hud();if(guardHit>=3)guardFall=true}});
    msg=`<span class="pts">+${pts.toLocaleString('ar')}</span> — ${T.ex}`;
    $('#rt').textContent=st.streak>=3?'رائع! سلسلة متصلة':'أصبت!';$('#rt').style.color='var(--teal)';
  }else{
    st.streak=0;st.hearts--;shake=.7;const f=$('#flash');f.style.transition='none';f.style.opacity=.35;requestAnimationFrame(()=>{f.style.transition='';f.style.opacity=0});
    drawPanel(st.g);
    const head=why==='time'?'انتهى الوقت.':why==='role'?'الموقع غير صحيح.':'العلامة غير صحيحة.';
    msg=`${head} الصواب: <b>${T.r}</b> ${T.m==='الفتحة'?'منصوب':'مرفوع'} بـ<b>${T.m}</b>. ${T.ex}`;
    $('#rt').textContent=st.hearts>0?'أخطأت هذه المرة':'نفدت القلوب';$('#rt').style.color='var(--rose)';
  }
  $('#rw').textContent=T.d;$('#rw').style.color=ok?'var(--teal)':'var(--sand)';
  $('#rx').innerHTML=msg;$('#next').textContent=st.hearts>0?'تابع':'النتيجة';
  setTimeout(()=>{$('#q').hidden=true;$('#res').hidden=false;$('#next').focus({preventScroll:true})},ok?450:350);
  $('#timer').hidden=true;hud();
}
$('#next').addEventListener('click',()=>{
  if(st.hearts<=0)return end(false);
  const q=G[st.g];
  if(st.k<q.ts.length-1){st.k++;showQ();return}
  gates[st.g].open=true;st.g++;st.k=0;$('#card').classList.remove('on');
  if(st.g>=N){setTimeout(()=>end(true),1200);return}
  tz=gz(st.g)+7;hud();setTimeout(showQ,1700);
});
function end(win){
  st.run=false;$('#card').classList.remove('on');$('#timer').hidden=true;$('#boss').hidden=true;
  const acc=st.total?Math.round(st.correct/st.total*100):0;let best=st.score;
  try{best=Math.max(best,+localStorage.getItem('nahw-best')||0);localStorage.setItem('nahw-best',best)}catch(e){}
  const n=!win?(acc>=50?1:0):acc>=90?3:acc>=70?2:1;
  $('#et').textContent=win?'عبرتَ الجسر!':'سقطتَ عن الجسر';
  $('#stars').innerHTML=[0,1,2].map(i=>starSVG(i<n)).join('');
 try{const K='mt-nahw',P=JSON.parse(localStorage.getItem(K)||'{}'),o=P[WORLD]||{s:0,b:0};P[WORLD]={s:Math.max(o.s,win?n:0),b:Math.max(o.b,st.score)};localStorage.setItem(K,JSON.stringify(P))}catch(e){}
 $('#nextw').hidden=!(win&&WORLD<4);
  $('#es').textContent=st.score.toLocaleString('ar');
  $('#ea').textContent=acc.toLocaleString('ar')+'٪';$('#eb').textContent=best.toLocaleString('ar');
  $('#end').hidden=false;
}
function reset(){
  Object.assign(st,{g:0,k:0,hearts:3,score:0,streak:0,correct:0,total:0,run:false});
  G.forEach(q=>q.ts.forEach(t=>delete t.ok));
  gates.forEach((o,i)=>{o.open=false;o.doors.forEach(d=>d.position.x=d.userData.x0);drawPanel(i)});
  guardHit=0;guardFall=false;guardVy=0;guard.position.copy(g0);guard.scale.setScalar(1);
  tz=gz(0)+7;pl.position.z=tz;hud();
}
$('#go').addEventListener('click',()=>{$('#start').hidden=true;reset();setTimeout(showQ,400)});
$('#again').addEventListener('click',()=>{$('#end').hidden=true;reset();setTimeout(showQ,400)});

/* ---------- الحلقة ---------- */
let W=0,H=0,dist=7;
function resize(){W=innerWidth;H=innerHeight;ren.setSize(W,H,false);cam.aspect=W/H;
  dist=cam.aspect<.75?11:7.5;cam.fov=cam.aspect<.75?64:56;cam.setViewOffset(W,H,0,H*.12,W,H);cam.updateProjectionMatrix()}
const ro=new ResizeObserver(resize);ro.observe(document.body);resize();
let last=performance.now(),T=0;
function loop(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;T+=dt;
  const dz=tz-pl.position.z;pl.position.z+=dz*Math.min(1,dt*1.9);
  const walking=Math.abs(dz)>.08;body.position.y=.9+(walking?Math.abs(Math.sin(T*10))*.12:Math.sin(T*2)*.03);
  head.position.y=body.position.y+.96;cap.position.y=head.position.y+.07;
  orb.position.y=1.45+Math.sin(T*3)*.1;ring.rotation.z+=dt*1.5;
  gates.forEach(o=>{o.doors.forEach(d=>{const x=o.open?d.userData.x1:d.userData.x0;d.position.x+=(x-d.position.x)*Math.min(1,dt*2.5)});
    if(o.pulse>0){o.pulse=Math.max(0,o.pulse-dt*1.5);o.panel.scale.setScalar(1+o.pulse*.12)}});
  guard.rotation.y+=dt*(1+guardHit);
  if(guardFall){guardVy-=dt*18;guard.position.y+=guardVy*dt;guard.rotation.x+=dt*4}
  else{guard.position.y=g0.y+Math.sin(T*1.6)*.4;guard.scale.setScalar(1-guardHit*.15)}
  for(let i=shots.length-1;i>=0;i--){const s=shots[i];s.t+=dt*1.7;const k=Math.min(1,s.t);
    s.m.position.lerpVectors(s.a,s.b,k);s.m.position.y+=Math.sin(k*Math.PI)*2.2;
    if(k>=1){scene.remove(s.m);shots.splice(i,1);s.cb()}}
  if(st.run){st.left-=dt;const p=Math.max(0,st.left/st.max);const bar=$('#timer i');bar.style.width=(p*100)+'%';bar.style.background=p<.3?'var(--rose)':'var(--teal)';
    if(st.left<=0)resolve(false,'time')}
  shake=Math.max(0,shake-dt*1.8);const sx=(Math.random()-.5)*shake,sy=(Math.random()-.5)*shake;
  cam.position.set(sx,pl.position.y+3.6+sy,pl.position.z+dist);
  cam.lookAt(0,4.2,pl.position.z-8);
  ren.render(scene,cam);requestAnimationFrame(loop);
}
hud();
const fontsReady=document.fonts?document.fonts.load('700 96px Amiri'):Promise.resolve();
fontsReady.catch(()=>{}).then(()=>gates.forEach((o,i)=>drawPanel(i)));
requestAnimationFrame(loop);
}
</script>
<script>{const go=h=>{try{location.hash=h}catch(e){}location.reload()};
document.querySelectorAll('.home').forEach(b=>b.addEventListener('click',()=>go('')));
document.getElementById('nextw').addEventListener('click',()=>go('world-2'));}</script>
