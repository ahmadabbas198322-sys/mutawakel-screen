<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14112b">
<title>منصة المتوكل التعليمية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Noto+Kufi+Arabic:wght@400;600;800&display=swap" rel="stylesheet">
<style>
/* VOICE: منصة تعليمية جادة وممتعة للشباب، فخمة دون تكلّف
   IDEA: خريطة رحلة ليلية تمرّ بأربعة عوالم، كل عالم بلونه ومشهده
   PICTURE: بطاقات العوالم مرسومة بمشاهد صغيرة تشبه اللعبة، متصلة بدرب منقّط
   COLOUR and TYPE: ليل نيلي وذهب رملي، ولكل عالم لونه — Amiri للعناوين، Noto Kufi للنص
   LAYOUT: ترويسة المنصة، عنوان التحدي ونجومه، ثم الدرب بالعوالم، ثم أدوات المعلم */
:root{color-scheme:dark;--bg:#14112b;--card:#1f1a42;--sand:#f0c873;--teal:#43d6c8;--ink:#f3ecff;--mute:#b4abd6}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;color:var(--ink);font:16px/1.65 "Noto Kufi Arabic",Tahoma,sans-serif;overflow-x:clip;
 background:radial-gradient(1200px 500px at 50% -120px,#2c2466 0%,transparent 70%),var(--bg);min-height:100vh}
.wrap{max-width:720px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 18px) max(4vw,16px) calc(env(safe-area-inset-bottom) + 30px)}
.brand{display:flex;align-items:center;gap:12px}
.brand svg{width:46px;height:46px;flex:none}
.brand b{display:block;font-size:17px;font-weight:800;line-height:1.3}
.brand span{font-size:13px;color:var(--sand);font-weight:600}
.hero{text-align:center;padding:30px 0 8px}
.hero .kick{display:inline-block;font-size:14px;font-weight:600;color:#2a1a05;background:var(--sand);border-radius:999px;padding:3px 14px}
h1{font:700 clamp(52px,15vw,84px)/1.05 Amiri,serif;margin:12px 0 6px;color:var(--sand);text-wrap:balance}
.hero p{margin:0 auto;max-width:30em;color:var(--mute);font-size:16px}
.total{display:inline-flex;align-items:center;gap:8px;margin-top:16px;background:#ffffff0f;border:1px solid #ffffff1c;border-radius:999px;padding:6px 16px;font-weight:700}
.total svg{width:20px;height:20px}
.path{position:relative;margin-top:28px;display:grid;gap:22px}
.path::before{content:"";position:absolute;top:30px;bottom:30px;inset-inline-start:27px;border-inline-start:3px dotted #f0c87355}
.world{position:relative;display:grid;grid-template-columns:58px minmax(0,1fr);gap:12px;align-items:start}
.num{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;font:800 22px "Noto Kufi Arabic";background:var(--c);color:#14112b;box-shadow:0 0 0 6px var(--bg),0 0 24px var(--c);z-index:1}
.world.locked .num{background:#3a3560;color:var(--mute);box-shadow:0 0 0 6px var(--bg)}
.card{background:var(--card);border-radius:20px;overflow:hidden;border:1px solid #ffffff14}
.scene{display:block;width:100%;height:auto;aspect-ratio:16/7}
.body{padding:12px 16px 16px}
.body h2{margin:0;font:700 30px/1.25 Amiri,serif}
.topic{color:var(--c);font-weight:700;font-size:15px}
.body p{margin:6px 0 12px;color:var(--mute);font-size:15px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.stars{display:flex;gap:2px}.stars svg{width:24px;height:24px}
.best{font-size:13px;color:var(--mute)}
.play{font:800 17px "Noto Kufi Arabic";color:#14112b;background:var(--c);border:0;border-radius:14px;min-height:48px;padding:0 26px;cursor:pointer}
.play:active{transform:scale(.96)}
.play:focus-visible,.tools button:focus-visible{outline:3px solid var(--sand);outline-offset:3px}
.lockmsg{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--mute)}
.lockmsg svg{width:18px;height:18px}
.world.locked .scene{filter:grayscale(.85) brightness(.55)}
.tools{margin-top:34px;display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.tools button{font:600 14px "Noto Kufi Arabic";color:var(--ink);background:#ffffff0d;border:1px solid #ffffff22;border-radius:12px;min-height:44px;padding:0 16px;cursor:pointer}
.tools button[aria-pressed=true]{border-color:var(--sand);color:var(--sand)}
.foot{text-align:center;color:var(--mute);font-size:13px;margin-top:22px}
#loading{position:fixed;inset:0;display:grid;place-items:center;background:var(--bg);z-index:9;text-align:center}
#loading b{display:block;font:700 34px Amiri,serif;color:var(--sand)}
#loading i{display:block;width:44px;height:44px;margin:16px auto 0;border-radius:50%;border:4px solid #ffffff22;border-top-color:var(--sand);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(1turn)}}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){#loading i{animation:none}}
</style>
</head>
<body>
<div class="wrap">
  <header class="brand">
    <svg viewBox="0 0 48 48" aria-hidden="true"><rect width="48" height="48" rx="14" fill="#f0c873"/><path d="M10 15c5-2 10-1.5 14 1.5V37c-4-3-9-3.5-14-1.5z" fill="#14112b"/><path d="M38 15c-5-2-10-1.5-14 1.5V37c4-3 9-3.5 14-1.5z" fill="#2c2466"/><path d="M24 6l1.8 3.8 4.2.5-3.1 2.9.8 4.1-3.7-2-3.7 2 .8-4.1-3.1-2.9 4.2-.5z" fill="#14112b"/></svg>
    <div><b>منصة المتوكل التعليمية</b><span>تحدي المرح التعليمي</span></div>
  </header>

  <section class="hero">
    <span class="kick">تحدي المرح التعليمي</span>
    <h1>رحلة النحو</h1>
    <p>أربعة عوالم ثلاثية الأبعاد، لكل عالم طريقة لعب مختلفة. اجتز العالم لتفتح الذي بعده، واجمع النجوم.</p>
    <div class="total" id="total"></div>
  </section>

  <main class="path" id="path"></main>

  <div class="tools">
    <button id="teacher" aria-pressed="false">وضع المعلم: فتح جميع العوالم</button>
    <button id="sound" aria-pressed="true">الأصوات: مفعّلة</button>
    <button id="reset">إعادة التقدم من البداية</button>
  </div>
  <p class="foot">يُحفظ تقدّمك على هذا الجهاز · منصة المتوكل التعليمية</p>
</div>
<div id="loading" hidden><div><b id="lt"></b><i></i></div></div>

<script>
{
const $=s=>document.querySelector(s);
const ar=n=>n.toLocaleString('ar');
const WORLDS=[
 {n:1,c:'#43d6c8',name:'حُرّاس الإعراب',topic:'المرفوعات',play:'تمشي على جسر ليلي، وتفتح كل بوابة بتحديد موقع الكلمة وعلامة رفعها.',
  svg:`<rect width="320" height="140" fill="#1b1740"/><circle cx="268" cy="34" r="16" fill="#fff1c9"/>${[...Array(18)].map((_,i)=>`<circle cx="${(i*53)%320}" cy="${(i*29)%70+6}" r="1.3" fill="#fff"/>`).join('')}<path d="M70 140 L140 70 H180 L250 140z" fill="#5b4b6e"/><rect x="124" y="30" width="72" height="16" rx="3" fill="#15122e" stroke="#f0c873" stroke-width="2"/><rect x="136" y="48" width="10" height="44" fill="#8a7194"/><rect x="174" y="48" width="10" height="44" fill="#8a7194"/><rect x="146" y="52" width="28" height="40" fill="#d49a4a"/><circle cx="160" cy="112" r="6" fill="#f3d6a8"/><path d="M152 134 L156 118 H164 L168 134z" fill="#2fa89d"/>`},
 {n:2,c:'#ff8f6a',name:'برج الرماة',topic:'المنصوبات',play:'تقف على برج عند الغروب، والجمل تطير نحوك، فتصيب كل منصوب بسهم نوعه.',
  svg:`<defs><linearGradient id="g2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a1035"/><stop offset=".62" stop-color="#c8566a"/><stop offset=".75" stop-color="#f2925a"/></linearGradient></defs><rect width="320" height="140" fill="url(#g2)"/><circle cx="90" cy="100" r="26" fill="#ffb46a"/><path d="M0 112 Q80 96 160 112 T320 108 V140 H0z" fill="#542433"/><rect x="226" y="58" width="34" height="82" fill="#8a6474"/><rect x="222" y="50" width="42" height="10" fill="#8a6474"/><rect x="118" y="34" width="44" height="18" rx="4" fill="#240e2c" stroke="#f0c873" stroke-width="2"/><rect x="170" y="44" width="40" height="18" rx="4" fill="#240e2c" stroke="#f0c873" stroke-width="2"/><path d="M220 56 L168 54" stroke="#43d6c8" stroke-width="2.5" stroke-dasharray="3 5"/>`},
 {n:3,c:'#7fc8ff',name:'جسور الوادي',topic:'المجرورات',play:'تبني جسرًا بين جزر معلّقة بكتل الكلمات، والكتلة الخاطئة تسقط في الوادي.',
  svg:`<defs><linearGradient id="g3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3f93c4"/><stop offset=".7" stop-color="#cfeaf0"/></linearGradient></defs><rect width="320" height="140" fill="url(#g3)"/><ellipse cx="60" cy="126" rx="60" ry="12" fill="#fff" opacity=".85"/><ellipse cx="250" cy="130" rx="80" ry="12" fill="#fff" opacity=".85"/><path d="M40 80 h64 l-32 46z" fill="#b08a6a"/><rect x="40" y="72" width="64" height="10" rx="4" fill="#6fae6a"/><path d="M216 70 h70 l-35 50z" fill="#b08a6a"/><rect x="216" y="62" width="70" height="10" rx="4" fill="#6fae6a"/><rect x="104" y="74" width="36" height="8" fill="#e8c48a"/><rect x="142" y="74" width="36" height="8" fill="#e8c48a"/><rect x="180" y="74" width="36" height="8" fill="#fff" opacity=".35"/><path d="M232 62 l6-18 6 18z" fill="#3f8f5a"/>`},
 {n:4,c:'#6fe0a8',name:'قلعة الانقلاب',topic:'النواسخ',play:'يسقط الناسخ على الجملة فتدور القاعة، وتصلح الحركات قبل ارتطام الكتل بالأرض.',
  svg:`<rect width="320" height="140" fill="#0f1a1a"/><rect x="0" y="112" width="320" height="28" fill="#34433f"/><rect x="40" y="10" width="20" height="102" fill="#3c4d4a"/><rect x="260" y="10" width="20" height="102" fill="#3c4d4a"/><circle cx="160" cy="34" r="16" fill="#7fe0c0"/><rect x="62" y="40" width="18" height="40" fill="#8a2338"/><rect x="240" y="40" width="18" height="40" fill="#8a2338"/><circle cx="72" cy="90" r="4" fill="#ffa040"/><circle cx="248" cy="90" r="4" fill="#ffa040"/><rect x="196" y="62" width="36" height="22" rx="3" fill="#f0c873"/><rect x="152" y="62" width="40" height="22" rx="3" fill="#2e4a46" stroke="#f0c873" stroke-width="2"/><rect x="104" y="62" width="44" height="22" rx="3" fill="#2e4a46" stroke="#f0c873" stroke-width="2"/>`}
];
const K='mt-nahw',KT='mt-teacher';
const load=()=>{try{return JSON.parse(localStorage.getItem(K)||'{}')}catch(e){return{}}};
const teacher=()=>{try{return localStorage.getItem(KT)==='1'}catch(e){return false}};
const star=on=>`<svg viewBox="0 0 24 24"><path fill="${on?'#f0c873':'#ffffff22'}" d="M12 2l3 6.6 7.2.8-5.4 4.9 1.5 7.1L12 17.8 5.7 21.4l1.5-7.1L1.8 9.4 9 8.6z"/></svg>`;
const lockI='<svg viewBox="0 0 24 24"><path fill="currentColor" d="M7 10V7a5 5 0 0110 0v3h1a1 1 0 011 1v9a1 1 0 01-1 1H6a1 1 0 01-1-1v-9a1 1 0 011-1zm2 0h6V7a3 3 0 00-6 0z"/></svg>';
const open=(P,n)=>teacher()||n===1||((P[n-1]||{}).s>0);
function render(){
 const P=load();let tot=0;WORLDS.forEach(w=>tot+=(P[w.n]||{}).s||0);
 $('#total').innerHTML=`${star(true)} ${ar(tot)} من ${ar(12)} نجمة`;
 $('#path').innerHTML=WORLDS.map(w=>{const o=P[w.n]||{s:0,b:0},u=open(P,w.n);
  return `<article class="world${u?'':' locked'}" style="--c:${w.c}">
   <div class="num">${ar(w.n)}</div>
   <div class="card"><svg class="scene" viewBox="0 0 320 140" preserveAspectRatio="xMidYMid slice" aria-hidden="true">${w.svg}</svg>
    <div class="body"><span class="topic">العالم ${ar(w.n)} · ${w.topic}</span><h2>${w.name}</h2><p>${w.play}</p>
     <div class="row"><div><div class="stars">${[1,2,3].map(i=>star(i<=o.s)).join('')}</div>${o.b?`<span class="best">أفضل نتيجة: ${ar(o.b)}</span>`:''}</div>
      ${u?`<button class="play" data-n="${w.n}">${o.s?'العب مجددًا':'ابدأ'}</button>`:`<span class="lockmsg">${lockI} اجتز العالم ${ar(w.n-1)} لفتحه</span>`}
     </div></div></div></article>`}).join('');
 $('#teacher').setAttribute('aria-pressed',teacher());
}
function launch(n){
 $('#lt').textContent=WORLDS[n-1].name;$('#loading').hidden=false;
 fetch('w'+n+'.html').then(r=>{if(!r.ok)throw 0;return r.text()}).then(t=>{document.open();document.write(t);document.close()})
 .catch(()=>{$('#loading').hidden=true;try{location.hash=''}catch(e){}render()})}
$('#path').addEventListener('click',e=>{const b=e.target.closest('.play');if(!b)return;const n=+b.dataset.n;try{location.hash='world-'+n}catch(_){}launch(n)});
$('#teacher').addEventListener('click',()=>{try{localStorage.setItem(KT,teacher()?'0':'1')}catch(e){}render()});
const rs=$('#reset');let armed=false;
rs.addEventListener('click',()=>{if(!armed){armed=true;rs.textContent='اضغط مرة أخرى للتأكيد';setTimeout(()=>{armed=false;rs.textContent='إعادة التقدم من البداية'},3000);return}
 try{localStorage.removeItem(K)}catch(e){}armed=false;rs.textContent='إعادة التقدم من البداية';render()});
const snd=$('#sound');const sOn=()=>{try{return localStorage.getItem('mt-sound')!=='0'}catch(e){return true}};
const sRen=()=>{snd.textContent='الأصوات: '+(sOn()?'مفعّلة':'متوقفة');snd.setAttribute('aria-pressed',sOn())};
snd.addEventListener('click',()=>{try{localStorage.setItem('mt-sound',sOn()?'0':'1')}catch(e){}sRen()});sRen();
render();
const m=location.hash.match(/^#world-([1-4])$/);
if(m&&open(load(),+m[1]))launch(+m[1]);
}
</script>
</body>
</html>
