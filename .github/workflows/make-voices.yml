name: make-voices
on:
  workflow_dispatch:
  push:
    paths: ['tools/voices.json', 'tools/make_voices.py']
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: pip install edge-tts
      - run: python tools/make_voices.py
      - run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add sighar/sounds/voice
          git commit -m "نطق الأقسام الجديدة في مرح الصغار" || echo nothing
          git pull --rebase || true
          git push
